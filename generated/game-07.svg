<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Steampunk Uçan Zeplin Şehri (Hava Gemisi)">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(126 .5 .5)">
      <stop offset="0" stop-color="#1d1730"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <polygon points="1066,36 1072,108 1001,121 995,49" fill="#ec4899" opacity="0.17"/><polygon points="569,320 543,219 641,183 667,284" fill="#8b5cf6" opacity="0.13"/><polygon points="482,37 681,-38 775,153 576,228" fill="#ec4899" opacity="0.08"/><polygon points="944,681 803,793 678,664 819,551" fill="#8b5cf6" opacity="0.11"/><polygon points="45,657 216,597 292,761 121,822" fill="#ec4899" opacity="0.17"/><polygon points="179,710 31,851 -123,716 25,576" fill="#8b5cf6" opacity="0.15"/><polygon points="178,606 250,402 459,455 387,658" fill="#ec4899" opacity="0.06"/><polygon points="696,397 800,535 673,652 568,514" fill="#8b5cf6" opacity="0.07"/><polygon points="185,849 226,679 400,704 359,874" fill="#ec4899" opacity="0.12"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="416" cy="609" rx="380" ry="150" fill="#8b5cf6" opacity=".18" filter="url(#soften)"/>

  <g><path d="M694.2,313.1 L630.9,276.6 L630.9,203.5 L694.2,167.0 L757.5,203.5 L757.5,276.6 Z" fill="#ec4899" opacity="0.53" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M480.6,532.4 L372.5,470.0 L372.5,345.1 L480.6,282.7 L588.8,345.1 L588.8,470.0 Z" fill="#8b5cf6" opacity="0.53" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M422.2,380.0 L355.9,341.8 L355.9,265.2 L422.2,226.9 L488.5,265.2 L488.5,341.8 Z" fill="#ec4899" opacity="0.42" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M519.8,355.6 L412.7,293.7 L412.7,170.0 L519.8,108.1 L627.0,170.0 L627.0,293.7 Z" fill="#8b5cf6" opacity="0.58" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M400.0,457.0 L336.0,420.1 L336.0,346.1 L400.0,309.2 L464.0,346.1 L464.0,420.1 Z" fill="#ec4899" opacity="0.60" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M404.2,565.8 L299.8,505.5 L299.8,384.9 L404.2,324.6 L508.6,384.9 L508.6,505.5 Z" fill="#8b5cf6" opacity="0.46" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M661.0,303.2 L599.8,267.8 L599.8,197.1 L661.0,161.8 L722.3,197.1 L722.3,267.8 Z" fill="#ec4899" opacity="0.31" stroke="rgba(255,255,255,.4)" stroke-width="2"/></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="303" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#8b5cf6"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">OYUN &amp; KONSEPT SANAT</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Steampunk Uçan Zeplin Şehri (Hava</tspan><tspan x="60" y="628.5">Gemisi)</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#8b5cf6"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · ORTA</text>
    <text x="808" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">STEAMPUNK  ·  ZEPLIN</text>
  </g>
</svg>
