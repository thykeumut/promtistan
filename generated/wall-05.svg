<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Pastel Günbatımı &amp; Sakin Okyanus Dalgaları">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(125 .5 .5)">
      <stop offset="0" stop-color="#22162c"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <polygon points="937,595 772,609 743,445 908,432" fill="#6366f1" opacity="0.10"/><polygon points="1064,222 968,125 1055,20 1151,117" fill="#ec4899" opacity="0.09"/><polygon points="149,274 83,234 117,165 182,205" fill="#6366f1" opacity="0.15"/><polygon points="644,574 740,516 807,607 711,665" fill="#ec4899" opacity="0.14"/><polygon points="876,653 826,773 702,735 751,615" fill="#6366f1" opacity="0.13"/><polygon points="72,20 188,-63 282,44 166,128" fill="#ec4899" opacity="0.12"/><polygon points="-16,856 -35,684 134,649 153,821" fill="#6366f1" opacity="0.14"/><polygon points="221,203 358,112 461,239 325,330" fill="#ec4899" opacity="0.11"/><polygon points="195,86 291,-86 471,-7 375,164" fill="#6366f1" opacity="0.13"/><polygon points="1229,184 1143,201 1118,116 1204,99" fill="#ec4899" opacity="0.14"/><polygon points="784,10 870,200 689,303 603,113" fill="#6366f1" opacity="0.13"/><polygon points="1014,325 1156,242 1252,375 1110,458" fill="#ec4899" opacity="0.08"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="846" cy="593" rx="380" ry="150" fill="#ec4899" opacity=".18" filter="url(#soften)"/>

  <g>
        <circle cx="600" cy="300" r="128" fill="#ec4899" opacity=".55"/>
        <circle cx="600" cy="300" r="128" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="2" opacity=".5"/>
        <circle cx="522" cy="286" r="112" fill="#22162c"/>
        <ellipse cx="600" cy="520" rx="420" ry="60" fill="#6366f1" opacity=".22"/>
        <circle cx="234" cy="151" r="2.9" fill="#fff" opacity="0.23"/><circle cx="1145" cy="329" r="1.7" fill="#fff" opacity="0.47"/><circle cx="272" cy="226" r="3.9" fill="#fff" opacity="0.57"/><circle cx="594" cy="276" r="3.4" fill="#fff" opacity="0.37"/><circle cx="58" cy="426" r="4.4" fill="#fff" opacity="0.25"/><circle cx="653" cy="305" r="3.1" fill="#fff" opacity="0.37"/><circle cx="674" cy="293" r="3.3" fill="#fff" opacity="0.56"/><circle cx="1150" cy="322" r="3.4" fill="#fff" opacity="0.25"/><circle cx="917" cy="411" r="3.2" fill="#fff" opacity="0.73"/><circle cx="318" cy="429" r="1.9" fill="#fff" opacity="0.45"/><circle cx="559" cy="447" r="3.1" fill="#fff" opacity="0.39"/><circle cx="191" cy="391" r="3.5" fill="#fff" opacity="0.50"/><circle cx="1015" cy="456" r="1.6" fill="#fff" opacity="0.28"/><circle cx="51" cy="369" r="2.4" fill="#fff" opacity="0.71"/><circle cx="1005" cy="218" r="2.5" fill="#fff" opacity="0.27"/><circle cx="557" cy="341" r="3.2" fill="#fff" opacity="0.50"/><circle cx="635" cy="204" r="2.6" fill="#fff" opacity="0.29"/><circle cx="721" cy="227" r="3.4" fill="#fff" opacity="0.27"/><circle cx="778" cy="140" r="3.5" fill="#fff" opacity="0.27"/><circle cx="67" cy="289" r="2.5" fill="#fff" opacity="0.40"/><circle cx="57" cy="447" r="2.9" fill="#fff" opacity="0.74"/><circle cx="394" cy="447" r="3.8" fill="#fff" opacity="0.21"/><circle cx="1025" cy="346" r="4.4" fill="#fff" opacity="0.64"/><circle cx="85" cy="299" r="3.4" fill="#fff" opacity="0.44"/><circle cx="649" cy="219" r="3.6" fill="#fff" opacity="0.30"/><circle cx="671" cy="323" r="3.5" fill="#fff" opacity="0.69"/>
      </g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="303" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#ec4899"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">DUVAR KAĞIDI &amp; LO-FI</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Pastel Günbatımı &amp; Sakin Okyanus</tspan><tspan x="60" y="628.5">Dalgaları</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#ec4899"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · BAŞLANGIÇ</text>
    <text x="659" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">PASTEL GÜNBATIMI  ·  OKYANUS DALGASI</text>
  </g>
</svg>
