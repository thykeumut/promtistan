<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Neon Işıklı Sinematik Cyberpunk Sokak Portresi">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(130 .5 .5)">
      <stop offset="0" stop-color="#2a1d16"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#ef4444" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <rect x="32" y="575" width="136" height="225" fill="#ef4444" opacity="0.14"/><rect x="832" y="559" width="136" height="241" fill="#ef4444" opacity="0.09"/><rect x="1032" y="443" width="136" height="357" fill="#f59e0b" opacity="0.08"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="450" cy="651" rx="380" ry="150" fill="#f59e0b" opacity=".18" filter="url(#soften)"/>

  <g transform="translate(600,340)"><path d="M170.0 0.0 L85.0 147.2 L1.8 52.0 Z" fill="#ef4444" opacity="0.5"/><path d="M85.0 147.2 L-85.0 147.2 L-44.1 27.6 Z" fill="#f59e0b" opacity="0.55"/><path d="M-85.0 147.2 L-170.0 0.0 L-45.9 -24.4 Z" fill="#ef4444" opacity="0.6"/><path d="M-170.0 0.0 L-85.0 -147.2 L-1.8 -52.0 Z" fill="#f59e0b" opacity="0.65"/><path d="M-85.0 -147.2 L85.0 -147.2 L44.1 -27.6 Z" fill="#ef4444" opacity="0.7"/><path d="M85.0 -147.2 L170.0 -0.0 L45.9 24.4 Z" fill="#f59e0b" opacity="0.75"/>
        <circle r="176" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="3"/>
        <circle r="62" fill="rgba(12,16,15,.65)" stroke="rgba(255,255,255,.9)" stroke-width="2"/>
        <circle r="14" fill="#f59e0b"/></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="331" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#f59e0b"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">PORTRE &amp; FOTOĞRAFÇILIK</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Neon Işıklı Sinematik Cyberpunk</tspan><tspan x="60" y="628.5">Sokak Portresi</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#f59e0b"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · İLERI DÜZEY</text>
    <text x="830" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">CYBERPUNK  ·  NEON</text>
  </g>
</svg>
