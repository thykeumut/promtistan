      <stop offset="0" stop-color="#16220f"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#0d9488" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0"/>
