<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Büyülü Biyolüminesans Mantar Ormanı">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(138 .5 .5)">
      <stop offset="0" stop-color="#1d1730"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <polygon points="687,201 734,274 665,329 618,255" fill="#ec4899" opacity="0.11"/><polygon points="977,489 1079,499 1079,601 977,591" fill="#8b5cf6" opacity="0.16"/><polygon points="42,170 -34,123 6,43 82,90" fill="#ec4899" opacity="0.15"/><polygon points="1121,302 1144,427 1021,462 998,337" fill="#8b5cf6" opacity="0.10"/><polygon points="344,637 427,553 518,628 435,711" fill="#ec4899" opacity="0.08"/><polygon points="784,151 822,25 952,50 914,177" fill="#8b5cf6" opacity="0.14"/><polygon points="729,423 632,325 720,219 817,316" fill="#ec4899" opacity="0.16"/><polygon points="44,89 175,231 45,375 -85,232" fill="#8b5cf6" opacity="0.08"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="878" cy="662" rx="380" ry="150" fill="#8b5cf6" opacity=".18" filter="url(#soften)"/>

  <g><path d="M617.3,398.8 L533.1,350.3 L533.1,253.1 L617.3,204.6 L701.4,253.1 L701.4,350.3 Z" fill="#ec4899" opacity="0.39" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M639.1,425.7 L561.9,381.1 L561.9,292.0 L639.1,247.5 L716.2,292.0 L716.2,381.1 Z" fill="#8b5cf6" opacity="0.69" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M666.3,360.2 L570.5,304.9 L570.5,194.3 L666.3,139.0 L762.1,194.3 L762.1,304.9 Z" fill="#ec4899" opacity="0.30" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M762.3,460.5 L674.0,409.5 L674.0,307.5 L762.3,256.5 L850.6,307.5 L850.6,409.5 Z" fill="#8b5cf6" opacity="0.34" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M508.8,472.2 L403.6,411.4 L403.6,290.0 L508.8,229.2 L614.0,290.0 L614.0,411.4 Z" fill="#ec4899" opacity="0.25" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M465.9,501.8 L375.6,449.7 L375.6,345.4 L465.9,293.3 L556.2,345.4 L556.2,449.7 Z" fill="#8b5cf6" opacity="0.56" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M484.1,380.3 L411.9,338.7 L411.9,255.3 L484.1,213.6 L556.3,255.3 L556.3,338.7 Z" fill="#ec4899" opacity="0.47" stroke="rgba(255,255,255,.4)" stroke-width="2"/></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="303" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#8b5cf6"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">OYUN &amp; KONSEPT SANAT</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Büyülü Biyolüminesans Mantar</tspan><tspan x="60" y="628.5">Ormanı</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#8b5cf6"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · ORTA</text>
    <text x="746" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">PANDORA  ·  BIYOLÜMINESANS</text>
  </g>
</svg>
