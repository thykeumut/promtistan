<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Minimalist Japon Güneş &amp; Bambu Ormanı Duvar Kağıdı">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(124 .5 .5)">
      <stop offset="0" stop-color="#22162c"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <path d="M-300 1000 L-73 1000 L547 -200 L320 -200 Z" fill="#6366f1" opacity="0.11"/><path d="M41 1000 L277 1000 L897 -200 L661 -200 Z" fill="#ec4899" opacity="0.13"/><path d="M477 1000 L655 1000 L1275 -200 L1097 -200 Z" fill="#6366f1" opacity="0.09"/><path d="M977 1000 L1261 1000 L1881 -200 L1597 -200 Z" fill="#ec4899" opacity="0.16"/><path d="M928 1000 L1045 1000 L1665 -200 L1548 -200 Z" fill="#6366f1" opacity="0.13"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="708" cy="603" rx="380" ry="150" fill="#ec4899" opacity=".18" filter="url(#soften)"/>

  <g>
        <circle cx="600" cy="300" r="128" fill="#ec4899" opacity=".55"/>
        <circle cx="600" cy="300" r="128" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="2" opacity=".5"/>
        <circle cx="522" cy="286" r="112" fill="#22162c"/>
        <ellipse cx="600" cy="520" rx="420" ry="60" fill="#6366f1" opacity=".22"/>
        <circle cx="345" cy="404" r="1.9" fill="#fff" opacity="0.36"/><circle cx="348" cy="161" r="2.4" fill="#fff" opacity="0.37"/><circle cx="311" cy="206" r="3.7" fill="#fff" opacity="0.75"/><circle cx="177" cy="407" r="3.6" fill="#fff" opacity="0.49"/><circle cx="829" cy="249" r="3.4" fill="#fff" opacity="0.70"/><circle cx="142" cy="167" r="2.3" fill="#fff" opacity="0.66"/><circle cx="950" cy="345" r="4.2" fill="#fff" opacity="0.27"/><circle cx="1064" cy="439" r="2.8" fill="#fff" opacity="0.55"/><circle cx="79" cy="341" r="2.2" fill="#fff" opacity="0.35"/><circle cx="1174" cy="357" r="2.2" fill="#fff" opacity="0.61"/><circle cx="1043" cy="256" r="3.4" fill="#fff" opacity="0.72"/><circle cx="109" cy="239" r="3.0" fill="#fff" opacity="0.61"/><circle cx="942" cy="294" r="2.3" fill="#fff" opacity="0.70"/><circle cx="962" cy="205" r="2.1" fill="#fff" opacity="0.58"/><circle cx="176" cy="142" r="2.3" fill="#fff" opacity="0.45"/><circle cx="242" cy="249" r="3.9" fill="#fff" opacity="0.34"/><circle cx="856" cy="208" r="3.8" fill="#fff" opacity="0.42"/><circle cx="400" cy="452" r="2.4" fill="#fff" opacity="0.43"/><circle cx="9" cy="275" r="3.7" fill="#fff" opacity="0.55"/><circle cx="472" cy="413" r="2.7" fill="#fff" opacity="0.47"/><circle cx="639" cy="225" r="4.0" fill="#fff" opacity="0.71"/><circle cx="796" cy="143" r="3.0" fill="#fff" opacity="0.78"/><circle cx="456" cy="289" r="3.8" fill="#fff" opacity="0.35"/><circle cx="192" cy="152" r="4.5" fill="#fff" opacity="0.42"/><circle cx="210" cy="430" r="3.6" fill="#fff" opacity="0.79"/><circle cx="1038" cy="438" r="4.3" fill="#fff" opacity="0.69"/>
      </g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="303" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#ec4899"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">DUVAR KAĞIDI &amp; LO-FI</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="50" font-weight="800" fill="#ffffff"><tspan x="60" y="568.0">Minimalist Japon Güneş &amp; Bambu Ormanı</tspan><tspan x="60" y="624.0">Duvar Kağıdı</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#ec4899"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · BAŞLANGIÇ</text>
    <text x="817" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">JAPON ZEN  ·  BAMBU</text>
  </g>
</svg>
