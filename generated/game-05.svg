<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Epik Anime Shonen Dövüş Sahnesi &amp; Enerji Patlaması">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(129 .5 .5)">
      <stop offset="0" stop-color="#1d1730"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <rect x="27" y="190" width="117" height="610" fill="#ec4899" opacity="0.06"/><rect x="199" y="220" width="117" height="580" fill="#8b5cf6" opacity="0.07"/><rect x="370" y="179" width="117" height="621" fill="#ec4899" opacity="0.12"/><rect x="542" y="270" width="117" height="530" fill="#8b5cf6" opacity="0.08"/><rect x="713" y="179" width="117" height="621" fill="#ec4899" opacity="0.09"/><rect x="885" y="623" width="117" height="177" fill="#8b5cf6" opacity="0.10"/><rect x="1056" y="419" width="117" height="381" fill="#ec4899" opacity="0.16"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="466" cy="586" rx="380" ry="150" fill="#8b5cf6" opacity=".18" filter="url(#soften)"/>

  <g><path d="M531.2,495.5 L438.1,441.8 L438.1,334.2 L531.2,280.4 L624.4,334.2 L624.4,441.8 Z" fill="#ec4899" opacity="0.32" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M697.8,307.6 L637.1,272.6 L637.1,202.6 L697.8,167.6 L758.4,202.6 L758.4,272.6 Z" fill="#8b5cf6" opacity="0.37" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M483.9,451.8 L375.5,389.2 L375.5,264.1 L483.9,201.5 L592.3,264.1 L592.3,389.2 Z" fill="#ec4899" opacity="0.41" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M690.6,370.4 L582.1,307.7 L582.1,182.4 L690.6,119.8 L799.1,182.4 L799.1,307.7 Z" fill="#8b5cf6" opacity="0.65" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M600.5,473.5 L528.7,432.0 L528.7,349.1 L600.5,307.6 L672.3,349.1 L672.3,432.0 Z" fill="#ec4899" opacity="0.27" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M663.3,388.4 L606.0,355.3 L606.0,289.1 L663.3,256.0 L720.6,289.1 L720.6,355.3 Z" fill="#8b5cf6" opacity="0.43" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M555.5,529.8 L462.9,476.3 L462.9,369.4 L555.5,315.9 L648.1,369.4 L648.1,476.3 Z" fill="#ec4899" opacity="0.28" stroke="rgba(255,255,255,.4)" stroke-width="2"/></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="303" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#8b5cf6"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">OYUN &amp; KONSEPT SANAT</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="50" font-weight="800" fill="#ffffff"><tspan x="60" y="568.0">Epik Anime Shonen Dövüş Sahnesi &amp; Enerji</tspan><tspan x="60" y="624.0">Patlaması</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#8b5cf6"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · İLERI DÜZEY</text>
    <text x="844" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">ANIME  ·  SHONEN</text>
  </g>
</svg>
