<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Akışkan Sıvı Renk Duvar Kağıdı — Takım Renkleri">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(130 .5 .5)">
      <stop offset="0" stop-color="#0d1a2a"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#fcd34d" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fcd34d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#1e293b" stop-opacity=".45"/>
      <stop offset="1" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <circle cx="11" cy="337" r="454" fill="#1e293b" opacity="0.14" filter="url(#soften)"/><circle cx="212" cy="526" r="506" fill="#fcd34d" opacity="0.09" filter="url(#soften)"/><circle cx="323" cy="720" r="400" fill="#1e293b" opacity="0.10" filter="url(#soften)"/><circle cx="1099" cy="397" r="236" fill="#fcd34d" opacity="0.08" filter="url(#soften)"/><circle cx="983" cy="562" r="294" fill="#1e293b" opacity="0.16" filter="url(#soften)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="643" cy="695" rx="380" ry="150" fill="#fcd34d" opacity=".18" filter="url(#soften)"/>

  <g transform="translate(600 400) rotate(11.5) scale(1.226 1.156) translate(-600 -400)"><g>
        <rect x="164" y="202" width="941" height="455" rx="26" fill="rgba(6,12,22,.72)" stroke="rgba(255,255,255,.42)" stroke-width="3"/>
        <rect x="190" y="228" width="889" height="403" rx="16" fill="rgba(4,9,18,.55)"/>
        <g fill="#fcd34d" opacity=".5"><path d="M164 593 C409 430 635 484 861 384 L1106 384 L1106 657 Z"</g>
        <circle cx="334" cy="330" r="76" fill="#1e293b" opacity=".3"/>
        <rect x="224" y="256" width="38" height="38" rx="10" fill="#fff" opacity="0.22"/><rect x="288" y="256" width="38" height="38" rx="10" fill="#fff" opacity="0.30"/><rect x="224" y="318" width="38" height="38" rx="10" fill="#fff" opacity="0.19"/><rect x="288" y="318" width="38" height="38" rx="10" fill="#fff" opacity="0.21"/>
        <rect x="682" y="292" width="339" height="197" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="704" y="346" width="339" height="205" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="726" y="400" width="339" height="192" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/>
        <rect x="520" y="679" width="160" height="20" rx="10" fill="rgba(255,255,255,.28)"/>
        <rect x="450" y="699" width="300" height="12" rx="6" fill="rgba(255,255,255,.16)"/>
      </g></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="488" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#fcd34d"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">BILGISAYAR &amp; TELEFON DUVAR KAĞIDI</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Akışkan Sıvı Renk Duvar Kağıdı —</tspan><tspan x="60" y="628.5">Takım Renkleri</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#fcd34d"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · ORTA</text>
    <text x="781" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">DUVAR KAĞIDI  ·  AKIŞKAN</text>
  </g>
</svg>
