  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(122 .5 .5)">
      <stop offset="0" stop-color="#16220f"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#f1f5f9" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f1f5f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#0b1220" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
