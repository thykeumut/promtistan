<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Antik Orman Elfi Tapınağı &amp; Zümrüt Şelale">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(141 .5 .5)">
      <stop offset="0" stop-color="#1d1730"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <path d="M387 -160 L171 960 L603 960 Z" fill="#ec4899" opacity="0.07"/><path d="M387 -160 L94 960 L680 960 Z" fill="#8b5cf6" opacity="0.14"/><path d="M387 -160 L17 960 L757 960 Z" fill="#ec4899" opacity="0.11"/><path d="M387 -160 L-60 960 L835 960 Z" fill="#8b5cf6" opacity="0.12"/><path d="M387 -160 L-137 960 L912 960 Z" fill="#ec4899" opacity="0.08"/><path d="M387 -160 L-215 960 L989 960 Z" fill="#8b5cf6" opacity="0.07"/><path d="M387 -160 L-292 960 L1066 960 Z" fill="#ec4899" opacity="0.08"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="852" cy="584" rx="380" ry="150" fill="#8b5cf6" opacity=".18" filter="url(#soften)"/>

  <g><path d="M683.4,395.9 L588.3,341.0 L588.3,231.2 L683.4,176.3 L778.5,231.2 L778.5,341.0 Z" fill="#ec4899" opacity="0.46" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M459.1,349.4 L386.8,307.7 L386.8,224.1 L459.1,182.4 L531.4,224.1 L531.4,307.7 Z" fill="#8b5cf6" opacity="0.57" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M767.8,337.4 L686.3,290.4 L686.3,196.3 L767.8,149.3 L849.2,196.3 L849.2,290.4 Z" fill="#ec4899" opacity="0.73" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M696.4,507.1 L642.9,476.2 L642.9,414.5 L696.4,383.6 L749.8,414.5 L749.8,476.2 Z" fill="#8b5cf6" opacity="0.69" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M573.6,400.3 L519.9,369.2 L519.9,307.2 L573.6,276.2 L627.3,307.2 L627.3,369.2 Z" fill="#ec4899" opacity="0.26" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M585.0,335.1 L499.2,285.6 L499.2,186.5 L585.0,136.9 L670.8,186.5 L670.8,285.6 Z" fill="#8b5cf6" opacity="0.28" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M645.2,554.1 L530.6,487.9 L530.6,355.5 L645.2,289.3 L759.9,355.5 L759.9,487.9 Z" fill="#ec4899" opacity="0.36" stroke="rgba(255,255,255,.4)" stroke-width="2"/></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="303" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#8b5cf6"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">OYUN &amp; KONSEPT SANAT</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Antik Orman Elfi Tapınağı &amp; Zümrüt</tspan><tspan x="60" y="628.5">Şelale</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#8b5cf6"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · ORTA</text>
    <text x="854" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">RIVENDELL  ·  ELF</text>
  </g>
</svg>
