<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Akıllı Telefon Dikey Katman Dağılımı">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(123 .5 .5)">
      <stop offset="0" stop-color="#151a33"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <circle cx="1063" cy="604" r="479" fill="#0ea5e9" opacity="0.16" filter="url(#soften)"/><circle cx="2" cy="558" r="316" fill="#6366f1" opacity="0.14" filter="url(#soften)"/><circle cx="164" cy="561" r="503" fill="#0ea5e9" opacity="0.16" filter="url(#soften)"/><circle cx="741" cy="450" r="488" fill="#6366f1" opacity="0.15" filter="url(#soften)"/><circle cx="922" cy="279" r="438" fill="#0ea5e9" opacity="0.15" filter="url(#soften)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="515" cy="636" rx="380" ry="150" fill="#6366f1" opacity=".18" filter="url(#soften)"/>

  <g><path d="M600.0,664.0 L454.5,580.0 L454.5,412.0 L600.0,328.0 L745.5,412.0 L745.5,580.0 Z" fill="#6366f1" opacity="0.76" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M600.0,590.0 L454.5,506.0 L454.5,338.0 L600.0,254.0 L745.5,338.0 L745.5,506.0 Z" fill="#0ea5e9" opacity="0.64" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M600.0,516.0 L454.5,432.0 L454.5,264.0 L600.0,180.0 L745.5,264.0 L745.5,432.0 Z" fill="#6366f1" opacity="0.52" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M600.0,442.0 L454.5,358.0 L454.5,190.0 L600.0,106.0 L745.5,190.0 L745.5,358.0 Z" fill="#0ea5e9" opacity="0.40" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M600.0,368.0 L454.5,284.0 L454.5,116.0 L600.0,32.0 L745.5,116.0 L745.5,284.0 Z" fill="#6366f1" opacity="0.28" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M392 200 L392 496" stroke="rgba(255,255,255,.4)" stroke-width="1.5" stroke-dasharray="8 8" opacity=".7" transform="translate(0,0)"/><path d="M396 274 L396 496" stroke="rgba(255,255,255,.4)" stroke-width="1.5" stroke-dasharray="8 8" opacity=".7" transform="translate(0,-74)"/><path d="M400 348 L400 496" stroke="rgba(255,255,255,.4)" stroke-width="1.5" stroke-dasharray="8 8" opacity=".7" transform="translate(0,-148)"/></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="289" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#6366f1"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">PATLATILMIŞ GÖRÜNÜM</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Akıllı Telefon Dikey Katman</tspan><tspan x="60" y="628.5">Dağılımı</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#6366f1"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · ORTA</text>
    <text x="740" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">TÜKETICI ELEKTRONIĞI  ·  OLED</text>
  </g>
</svg>
