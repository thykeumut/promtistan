<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Telefon Duvar Kağıdı — Geometrik Forma Deseni">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(124 .5 .5)">
      <stop offset="0" stop-color="#0d1a2a"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#c084fc" stop-opacity=".55"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#db2777" stop-opacity=".45"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <rect x="-160" y="-120" width="55" height="1040" fill="#c084fc" opacity="0.08" transform="skewX(-13.4)"/><rect x="-8" y="-120" width="55" height="1040" fill="#db2777" opacity="0.14" transform="skewX(-13.4)"/><rect x="144" y="-120" width="55" height="1040" fill="#db2777" opacity="0.11" transform="skewX(-13.4)"/><rect x="296" y="-120" width="55" height="1040" fill="#c084fc" opacity="0.06" transform="skewX(-13.4)"/><rect x="448" y="-120" width="55" height="1040" fill="#db2777" opacity="0.15" transform="skewX(-13.4)"/><rect x="600" y="-120" width="55" height="1040" fill="#db2777" opacity="0.10" transform="skewX(-13.4)"/><rect x="752" y="-120" width="55" height="1040" fill="#c084fc" opacity="0.09" transform="skewX(-13.4)"/><rect x="904" y="-120" width="55" height="1040" fill="#db2777" opacity="0.11" transform="skewX(-13.4)"/><rect x="1056" y="-120" width="55" height="1040" fill="#db2777" opacity="0.12" transform="skewX(-13.4)"/><rect x="1208" y="-120" width="55" height="1040" fill="#c084fc" opacity="0.11" transform="skewX(-13.4)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="702" cy="593" rx="380" ry="150" fill="#c084fc" opacity=".18" filter="url(#soften)"/>

  <g transform="translate(600 400) rotate(1.9) scale(-1.317 1.013) translate(-600 -400)"><g>
        <rect x="155" y="202" width="925" height="452" rx="26" fill="rgba(6,12,22,.72)" stroke="rgba(255,255,255,.42)" stroke-width="3"/>
        <rect x="181" y="228" width="873" height="400" rx="16" fill="rgba(4,9,18,.55)"/>
        <g fill="#c084fc" opacity=".5"><path d="M155 592 C395 429 617 483 839 383 L1080 383 L1080 655 Z"</g>
        <circle cx="321" cy="329" r="108" fill="#db2777" opacity=".3"/>
        <rect x="215" y="256" width="38" height="38" rx="10" fill="#fff" opacity="0.16"/><rect x="279" y="256" width="38" height="38" rx="10" fill="#fff" opacity="0.30"/><rect x="215" y="318" width="38" height="38" rx="10" fill="#fff" opacity="0.12"/><rect x="279" y="318" width="38" height="38" rx="10" fill="#fff" opacity="0.25"/>
        <rect x="663" y="292" width="333" height="154" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="685" y="346" width="333" height="156" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/>
        <rect x="520" y="677" width="160" height="20" rx="10" fill="rgba(255,255,255,.28)"/>
        <rect x="450" y="697" width="300" height="12" rx="6" fill="rgba(255,255,255,.16)"/>
      </g></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="488" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#c084fc"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">BILGISAYAR &amp; TELEFON DUVAR KAĞIDI</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Telefon Duvar Kağıdı — Geometrik</tspan><tspan x="60" y="628.5">Forma Deseni</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#c084fc"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · BAŞLANGIÇ</text>
    <text x="784" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">DUVAR KAĞIDI  ·  TELEFON</text>
  </g>
</svg>
