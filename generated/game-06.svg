  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="320" cy="688" rx="380" ry="150" fill="#8b5cf6" opacity=".18" filter="url(#soften)"/>

  <g><path d="M701.2,368.8 L635.3,330.8 L635.3,254.8 L701.2,216.8 L767.0,254.8 L767.0,330.8 Z" fill="#ec4899" opacity="0.71" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M769.3,514.5 L650.4,445.9 L650.4,308.5 L769.3,239.9 L888.2,308.5 L888.2,445.9 Z" fill="#8b5cf6" opacity="0.55" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M547.2,476.2 L445.2,417.3 L445.2,299.5 L547.2,240.7 L649.2,299.5 L649.2,417.3 Z" fill="#ec4899" opacity="0.47" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M606.6,417.2 L504.8,358.5 L504.8,241.0 L606.6,182.2 L708.3,241.0 L708.3,358.5 Z" fill="#8b5cf6" opacity="0.53" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M756.0,550.9 L660.7,495.9 L660.7,385.7 L756.0,330.6 L851.4,385.7 L851.4,495.9 Z" fill="#ec4899" opacity="0.40" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M681.8,343.5 L607.0,300.3 L607.0,214.0 L681.8,170.8 L756.6,214.0 L756.6,300.3 Z" fill="#8b5cf6" opacity="0.55" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M570.7,442.4 L490.1,395.9 L490.1,302.9 L570.7,256.4 L651.2,302.9 L651.2,395.9 Z" fill="#ec4899" opacity="0.75" stroke="rgba(255,255,255,.4)" stroke-width="2"/></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="303" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#8b5cf6"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">OYUN &amp; KONSEPT SANAT</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="78" font-weight="800" fill="#ffffff"><tspan x="60" y="596.0">Retro 80\</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#8b5cf6"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · BAŞLANGIÇ</text>
    <text x="768" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">SYNTHWAVE  ·  RETROWAVE</text>
