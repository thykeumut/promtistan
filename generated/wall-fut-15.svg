<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Duvar Kağıdı — Altın Tipografi ve Boş Alan">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(139 .5 .5)">
      <stop offset="0" stop-color="#0d1a2a"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#4ade80" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#166534" stop-opacity=".45"/>
      <stop offset="1" stop-color="#166534" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <path d="M-300 1000 L-132 1000 L488 -200 L320 -200 Z" fill="#166534" opacity="0.12"/><path d="M47 1000 L166 1000 L786 -200 L667 -200 Z" fill="#4ade80" opacity="0.08"/><path d="M323 1000 L537 1000 L1157 -200 L943 -200 Z" fill="#166534" opacity="0.09"/><path d="M1044 1000 L1330 1000 L1950 -200 L1664 -200 Z" fill="#4ade80" opacity="0.17"/><path d="M1226 1000 L1347 1000 L1967 -200 L1846 -200 Z" fill="#166534" opacity="0.16"/><path d="M1621 1000 L1854 1000 L2474 -200 L2241 -200 Z" fill="#4ade80" opacity="0.12"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="879" cy="598" rx="380" ry="150" fill="#4ade80" opacity=".18" filter="url(#soften)"/>

  <g transform="translate(600 400) rotate(-8.9) scale(-1.065 1.069) translate(-600 -400)"><g>
        <rect x="178" y="231" width="893" height="455" rx="26" fill="rgba(6,12,22,.72)" stroke="rgba(255,255,255,.42)" stroke-width="3"/>
        <rect x="204" y="257" width="841" height="403" rx="16" fill="rgba(4,9,18,.55)"/>
        <g fill="#4ade80" opacity=".5"><path d="M178 622 C410 459 625 513 839 413 L1071 413 L1071 686 Z"</g>
        <circle cx="339" cy="359" r="105" fill="#166534" opacity=".3"/>
        <rect x="238" y="285" width="38" height="38" rx="10" fill="#fff" opacity="0.29"/><rect x="302" y="285" width="38" height="38" rx="10" fill="#fff" opacity="0.23"/><rect x="238" y="347" width="38" height="38" rx="10" fill="#fff" opacity="0.12"/><rect x="302" y="347" width="38" height="38" rx="10" fill="#fff" opacity="0.24"/><rect x="238" y="409" width="38" height="38" rx="10" fill="#fff" opacity="0.24"/><rect x="302" y="409" width="38" height="38" rx="10" fill="#fff" opacity="0.25"/>
        <rect x="669" y="321" width="321" height="181" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="691" y="375" width="321" height="196" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="713" y="429" width="321" height="182" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="735" y="483" width="321" height="168" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/>
        <rect x="520" y="708" width="160" height="20" rx="10" fill="rgba(255,255,255,.28)"/>
        <rect x="450" y="728" width="300" height="12" rx="6" fill="rgba(255,255,255,.16)"/>
      </g></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="488" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#4ade80"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">BILGISAYAR &amp; TELEFON DUVAR KAĞIDI</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Duvar Kağıdı — Altın Tipografi ve Boş</tspan><tspan x="60" y="628.5">Alan</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#4ade80"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · ORTA</text>
    <text x="769" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">DUVAR KAĞIDI  ·  TIPOGRAFI</text>
  </g>
</svg>
