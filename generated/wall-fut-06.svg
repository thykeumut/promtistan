<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Telefon Duvar Kağıdı — Dikey Oyuncu Posteri">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(134 .5 .5)">
      <stop offset="0" stop-color="#0d1a2a"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#1e3a8a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <path d="M-300 1000 L-150 1000 L470 -200 L320 -200 Z" fill="#1e3a8a" opacity="0.07"/><path d="M-7 1000 L164 1000 L784 -200 L613 -200 Z" fill="#22d3ee" opacity="0.07"/><path d="M468 1000 L590 1000 L1210 -200 L1088 -200 Z" fill="#1e3a8a" opacity="0.06"/><path d="M817 1000 L996 1000 L1616 -200 L1437 -200 Z" fill="#22d3ee" opacity="0.08"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="409" cy="598" rx="380" ry="150" fill="#22d3ee" opacity=".18" filter="url(#soften)"/>

  <g transform="translate(600 400) rotate(11.9) scale(-1.304 1.207) translate(-600 -400)"><g>
        <rect x="173" y="197" width="922" height="458" rx="26" fill="rgba(6,12,22,.72)" stroke="rgba(255,255,255,.42)" stroke-width="3"/>
        <rect x="199" y="223" width="870" height="406" rx="16" fill="rgba(4,9,18,.55)"/>
        <g fill="#22d3ee" opacity=".5"><path d="M173 591 C413 426 634 481 856 380 L1096 380 L1096 655 Z"</g>
        <circle cx="339" cy="325" r="80" fill="#1e3a8a" opacity=".3"/>
        <rect x="233" y="251" width="38" height="38" rx="10" fill="#fff" opacity="0.12"/><rect x="297" y="251" width="38" height="38" rx="10" fill="#fff" opacity="0.13"/><rect x="233" y="313" width="38" height="38" rx="10" fill="#fff" opacity="0.17"/><rect x="297" y="313" width="38" height="38" rx="10" fill="#fff" opacity="0.23"/><rect x="233" y="375" width="38" height="38" rx="10" fill="#fff" opacity="0.20"/><rect x="297" y="375" width="38" height="38" rx="10" fill="#fff" opacity="0.12"/><rect x="233" y="437" width="38" height="38" rx="10" fill="#fff" opacity="0.32"/><rect x="297" y="437" width="38" height="38" rx="10" fill="#fff" opacity="0.23"/>
        <rect x="681" y="287" width="332" height="208" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="703" y="341" width="332" height="176" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="725" y="395" width="332" height="198" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/>
        <rect x="520" y="677" width="160" height="20" rx="10" fill="rgba(255,255,255,.28)"/>
        <rect x="450" y="697" width="300" height="12" rx="6" fill="rgba(255,255,255,.16)"/>
      </g></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="488" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#22d3ee"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">BILGISAYAR &amp; TELEFON DUVAR KAĞIDI</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Telefon Duvar Kağıdı — Dikey Oyuncu</tspan><tspan x="60" y="628.5">Posteri</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#22d3ee"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · ORTA</text>
    <text x="784" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">DUVAR KAĞIDI  ·  TELEFON</text>
  </g>
</svg>
