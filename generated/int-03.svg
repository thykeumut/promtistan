<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Orman İçi Cam Duvarlı Modern Doğa Evi">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(119 .5 .5)">
      <stop offset="0" stop-color="#12241f"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#14b8a6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#84cc16" stop-opacity=".45"/>
      <stop offset="1" stop-color="#84cc16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <rect x="-160" y="-120" width="59" height="1040" fill="#14b8a6" opacity="0.07" transform="skewX(-16.0)"/><rect x="30" y="-120" width="59" height="1040" fill="#84cc16" opacity="0.06" transform="skewX(-16.0)"/><rect x="220" y="-120" width="59" height="1040" fill="#84cc16" opacity="0.08" transform="skewX(-16.0)"/><rect x="410" y="-120" width="59" height="1040" fill="#14b8a6" opacity="0.12" transform="skewX(-16.0)"/><rect x="600" y="-120" width="59" height="1040" fill="#84cc16" opacity="0.14" transform="skewX(-16.0)"/><rect x="790" y="-120" width="59" height="1040" fill="#84cc16" opacity="0.13" transform="skewX(-16.0)"/><rect x="980" y="-120" width="59" height="1040" fill="#14b8a6" opacity="0.15" transform="skewX(-16.0)"/><rect x="1170" y="-120" width="59" height="1040" fill="#84cc16" opacity="0.11" transform="skewX(-16.0)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="421" cy="614" rx="380" ry="150" fill="#14b8a6" opacity=".18" filter="url(#soften)"/>

  <g>
        <path d="M300 250 L600 140 L900 250" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="3"/>
        <path d="M330 250 L600 152 L870 250 Z" fill="#14b8a6" opacity=".22"/>
        <rect x="300" y="250" width="600" height="270" fill="rgba(10,18,16,.35)" stroke="rgba(255,255,255,.4)" stroke-width="2"/>
        <path d="M600 152 L600 520 M470 205 L470 520 M730 205 L730 520" stroke="rgba(255,255,255,.4)" stroke-width="2" opacity=".6"/>
        <rect x="380" y="380" width="440" height="90" rx="26" fill="#84cc16" opacity=".5"/>
        <rect x="410" y="330" width="380" height="70" rx="22" fill="#14b8a6" opacity=".45"/>
        <ellipse cx="600" cy="588" rx="230" ry="30" fill="rgba(0,0,0,.35)"/>
        <rect x="288" y="268" width="20" height="252" fill="#14b8a6" opacity=".3"/>
      </g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="260" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#14b8a6"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">İÇ MEKAN &amp; MIMARI</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Orman İçi Cam Duvarlı Modern Doğa</tspan><tspan x="60" y="628.5">Evi</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#14b8a6"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · İLERI DÜZEY</text>
    <text x="728" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">DOĞA EVI  ·  ORMAN MANZARASI</text>
  </g>
</svg>
