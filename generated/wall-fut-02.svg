<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Stadyum Gece Panoraması — Geniş Açı Duvar Kağıdı">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(131 .5 .5)">
      <stop offset="0" stop-color="#0d1a2a"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#a3a3a3" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a3a3a3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#0f0f0f" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0f0f0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <ellipse cx="451" cy="83" rx="220" ry="110" fill="none" stroke="#0f0f0f" stroke-width="2.8" opacity="0.19"/><ellipse cx="451" cy="83" rx="391" ry="198" fill="none" stroke="#a3a3a3" stroke-width="4.3" opacity="0.16"/><ellipse cx="451" cy="83" rx="534" ry="306" fill="none" stroke="#0f0f0f" stroke-width="4.9" opacity="0.25"/><ellipse cx="451" cy="83" rx="655" ry="397" fill="none" stroke="#a3a3a3" stroke-width="4.5" opacity="0.11"/><ellipse cx="451" cy="83" rx="940" ry="409" fill="none" stroke="#0f0f0f" stroke-width="4.2" opacity="0.14"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="616" cy="618" rx="380" ry="150" fill="#a3a3a3" opacity=".18" filter="url(#soften)"/>

  <g transform="translate(600 400) rotate(-5.7) scale(1.186 1.190) translate(-600 -400)"><g>
        <rect x="199" y="218" width="924" height="419" rx="26" fill="rgba(6,12,22,.72)" stroke="rgba(255,255,255,.42)" stroke-width="3"/>
        <rect x="225" y="244" width="872" height="367" rx="16" fill="rgba(4,9,18,.55)"/>
        <g fill="#a3a3a3" opacity=".5"><path d="M199 577 C439 427 661 477 883 385 L1123 385 L1123 636 Z"</g>
        <circle cx="365" cy="335" r="99" fill="#0f0f0f" opacity=".3"/>
        <rect x="259" y="272" width="38" height="38" rx="10" fill="#fff" opacity="0.13"/><rect x="323" y="272" width="38" height="38" rx="10" fill="#fff" opacity="0.16"/><rect x="387" y="272" width="38" height="38" rx="10" fill="#fff" opacity="0.25"/><rect x="259" y="334" width="38" height="38" rx="10" fill="#fff" opacity="0.19"/><rect x="323" y="334" width="38" height="38" rx="10" fill="#fff" opacity="0.29"/><rect x="387" y="334" width="38" height="38" rx="10" fill="#fff" opacity="0.18"/><rect x="259" y="396" width="38" height="38" rx="10" fill="#fff" opacity="0.29"/><rect x="323" y="396" width="38" height="38" rx="10" fill="#fff" opacity="0.24"/><rect x="387" y="396" width="38" height="38" rx="10" fill="#fff" opacity="0.17"/><rect x="259" y="458" width="38" height="38" rx="10" fill="#fff" opacity="0.28"/><rect x="323" y="458" width="38" height="38" rx="10" fill="#fff" opacity="0.24"/><rect x="387" y="458" width="38" height="38" rx="10" fill="#fff" opacity="0.30"/>
        <rect x="707" y="308" width="333" height="195" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="729" y="362" width="333" height="169" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/>
        <rect x="520" y="658" width="160" height="20" rx="10" fill="rgba(255,255,255,.28)"/>
        <rect x="450" y="678" width="300" height="12" rx="6" fill="rgba(255,255,255,.16)"/>
      </g></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="488" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#a3a3a3"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">BILGISAYAR &amp; TELEFON DUVAR KAĞIDI</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Stadyum Gece Panoraması — Geniş</tspan><tspan x="60" y="628.5">Açı Duvar Kağıdı</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#a3a3a3"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · ORTA</text>
    <text x="773" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">DUVAR KAĞIDI  ·  STADYUM</text>
  </g>
</svg>
