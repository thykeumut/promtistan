<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Dark Fantasy Souls-like Zindan &amp; Şövalye">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(132 .5 .5)">
      <stop offset="0" stop-color="#1d1730"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <rect x="259" y="404" width="82" height="396" fill="#ec4899" opacity="0.15"/><rect x="379" y="248" width="82" height="552" fill="#8b5cf6" opacity="0.06"/><rect x="499" y="181" width="82" height="619" fill="#ec4899" opacity="0.13"/><rect x="739" y="516" width="82" height="284" fill="#ec4899" opacity="0.12"/><rect x="859" y="448" width="82" height="352" fill="#8b5cf6" opacity="0.09"/><rect x="1099" y="319" width="82" height="481" fill="#8b5cf6" opacity="0.15"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="431" cy="680" rx="380" ry="150" fill="#8b5cf6" opacity=".18" filter="url(#soften)"/>

  <g><path d="M481.8,345.1 L385.6,289.6 L385.6,178.6 L481.8,123.1 L577.9,178.6 L577.9,289.6 Z" fill="#ec4899" opacity="0.45" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M683.4,401.7 L580.9,342.5 L580.9,224.1 L683.4,164.9 L785.9,224.1 L785.9,342.5 Z" fill="#8b5cf6" opacity="0.47" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M756.4,435.2 L685.6,394.3 L685.6,312.6 L756.4,271.7 L827.2,312.6 L827.2,394.3 Z" fill="#ec4899" opacity="0.49" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M807.4,479.6 L746.3,444.4 L746.3,373.9 L807.4,338.6 L868.4,373.9 L868.4,444.4 Z" fill="#8b5cf6" opacity="0.71" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M779.3,517.5 L707.8,476.2 L707.8,393.6 L779.3,352.3 L850.9,393.6 L850.9,476.2 Z" fill="#ec4899" opacity="0.63" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M698.4,391.6 L627.9,350.9 L627.9,269.5 L698.4,228.8 L768.9,269.5 L768.9,350.9 Z" fill="#8b5cf6" opacity="0.35" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M406.2,446.3 L296.4,382.8 L296.4,256.0 L406.2,192.6 L516.0,256.0 L516.0,382.8 Z" fill="#ec4899" opacity="0.42" stroke="rgba(255,255,255,.4)" stroke-width="2"/></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="303" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#8b5cf6"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">OYUN &amp; KONSEPT SANAT</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Dark Fantasy Souls-like Zindan &amp;</tspan><tspan x="60" y="628.5">Şövalye</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#8b5cf6"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · UZMAN / MASTER</text>
    <text x="775" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">ELDEN RING  ·  DARK SOULS</text>
  </g>
</svg>
