<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Kale Ağları ve Projektör Işığı — Soyut Duvar Kağıdı">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(141 .5 .5)">
      <stop offset="0" stop-color="#0d1a2a"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#818cf8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#0b1020" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <polygon points="1072,399 1131,555 982,630 922,474" fill="#0b1020" opacity="0.08"/><polygon points="285,106 89,149 28,-43 224,-85" fill="#818cf8" opacity="0.10"/><polygon points="1317,442 1171,575 1025,441 1171,309" fill="#0b1020" opacity="0.07"/><polygon points="936,495 988,447 1041,494 988,542" fill="#818cf8" opacity="0.12"/><polygon points="550,68 496,-7 567,-68 620,8" fill="#0b1020" opacity="0.12"/><polygon points="94,278 188,362 113,464 19,380" fill="#818cf8" opacity="0.16"/><polygon points="1006,683 1046,598 1135,630 1095,715" fill="#0b1020" opacity="0.12"/><polygon points="1225,113 1152,94 1164,20 1237,39" fill="#818cf8" opacity="0.08"/><polygon points="1242,693 1270,823 1143,863 1115,733" fill="#0b1020" opacity="0.05"/><polygon points="611,778 513,887 395,800 493,691" fill="#818cf8" opacity="0.14"/><polygon points="914,654 924,510 1069,507 1058,651" fill="#0b1020" opacity="0.06"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="806" cy="611" rx="380" ry="150" fill="#818cf8" opacity=".18" filter="url(#soften)"/>

  <g transform="translate(600 400) rotate(7.2) scale(1.168 1.051) translate(-600 -400)"><g>
        <rect x="168" y="225" width="917" height="409" rx="26" fill="rgba(6,12,22,.72)" stroke="rgba(255,255,255,.42)" stroke-width="3"/>
        <rect x="194" y="251" width="865" height="357" rx="16" fill="rgba(4,9,18,.55)"/>
        <g fill="#818cf8" opacity=".5"><path d="M168 577 C407 429 627 479 847 389 L1086 389 L1086 634 Z"</g>
        <circle cx="333" cy="339" r="92" fill="#0b1020" opacity=".3"/>
        <rect x="228" y="279" width="38" height="38" rx="10" fill="#fff" opacity="0.22"/><rect x="292" y="279" width="38" height="38" rx="10" fill="#fff" opacity="0.23"/><rect x="356" y="279" width="38" height="38" rx="10" fill="#fff" opacity="0.30"/><rect x="228" y="341" width="38" height="38" rx="10" fill="#fff" opacity="0.14"/><rect x="292" y="341" width="38" height="38" rx="10" fill="#fff" opacity="0.25"/><rect x="356" y="341" width="38" height="38" rx="10" fill="#fff" opacity="0.18"/><rect x="228" y="403" width="38" height="38" rx="10" fill="#fff" opacity="0.28"/><rect x="292" y="403" width="38" height="38" rx="10" fill="#fff" opacity="0.31"/><rect x="356" y="403" width="38" height="38" rx="10" fill="#fff" opacity="0.11"/><rect x="228" y="465" width="38" height="38" rx="10" fill="#fff" opacity="0.11"/><rect x="292" y="465" width="38" height="38" rx="10" fill="#fff" opacity="0.13"/><rect x="356" y="465" width="38" height="38" rx="10" fill="#fff" opacity="0.19"/>
        <rect x="673" y="315" width="330" height="185" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="695" y="369" width="330" height="167" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="717" y="423" width="330" height="166" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="739" y="477" width="330" height="176" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/>
        <rect x="520" y="656" width="160" height="20" rx="10" fill="rgba(255,255,255,.28)"/>
        <rect x="450" y="676" width="300" height="12" rx="6" fill="rgba(255,255,255,.16)"/>
      </g></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="488" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#818cf8"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">BILGISAYAR &amp; TELEFON DUVAR KAĞIDI</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="50" font-weight="800" fill="#ffffff"><tspan x="60" y="568.0">Kale Ağları ve Projektör Işığı — Soyut</tspan><tspan x="60" y="624.0">Duvar Kağıdı</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#818cf8"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · BAŞLANGIÇ</text>
    <text x="779" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">DUVAR KAĞIDI  ·  KALE AĞI</text>
  </g>
</svg>
