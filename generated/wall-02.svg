<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Lo-Fi Hip Hop Yağmurlu Pencere &amp; Kedili Gece">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(130 .5 .5)">
      <stop offset="0" stop-color="#22162c"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <path d="M-300 1000 L-123 1000 L497 -200 L320 -200 Z" fill="#6366f1" opacity="0.16"/><path d="M-19 1000 L190 1000 L810 -200 L601 -200 Z" fill="#ec4899" opacity="0.17"/><path d="M590 1000 L878 1000 L1498 -200 L1210 -200 Z" fill="#6366f1" opacity="0.08"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="690" cy="664" rx="380" ry="150" fill="#ec4899" opacity=".18" filter="url(#soften)"/>

  <g>
        <circle cx="600" cy="300" r="128" fill="#ec4899" opacity=".55"/>
        <circle cx="600" cy="300" r="128" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="2" opacity=".5"/>
        <circle cx="522" cy="286" r="112" fill="#22162c"/>
        <ellipse cx="600" cy="520" rx="420" ry="60" fill="#6366f1" opacity=".22"/>
        <circle cx="1176" cy="189" r="2.4" fill="#fff" opacity="0.46"/><circle cx="183" cy="432" r="3.4" fill="#fff" opacity="0.74"/><circle cx="835" cy="427" r="4.3" fill="#fff" opacity="0.62"/><circle cx="202" cy="406" r="4.0" fill="#fff" opacity="0.32"/><circle cx="1053" cy="291" r="2.1" fill="#fff" opacity="0.20"/><circle cx="1145" cy="420" r="1.9" fill="#fff" opacity="0.35"/><circle cx="960" cy="233" r="3.4" fill="#fff" opacity="0.45"/><circle cx="657" cy="173" r="1.7" fill="#fff" opacity="0.45"/><circle cx="0" cy="418" r="1.7" fill="#fff" opacity="0.50"/><circle cx="288" cy="459" r="3.9" fill="#fff" opacity="0.34"/><circle cx="13" cy="343" r="4.3" fill="#fff" opacity="0.52"/><circle cx="602" cy="458" r="3.5" fill="#fff" opacity="0.36"/><circle cx="1063" cy="375" r="3.6" fill="#fff" opacity="0.74"/><circle cx="449" cy="413" r="2.1" fill="#fff" opacity="0.56"/><circle cx="229" cy="347" r="3.2" fill="#fff" opacity="0.69"/><circle cx="102" cy="320" r="3.6" fill="#fff" opacity="0.42"/><circle cx="1154" cy="201" r="2.4" fill="#fff" opacity="0.70"/><circle cx="385" cy="153" r="3.8" fill="#fff" opacity="0.58"/><circle cx="531" cy="188" r="2.4" fill="#fff" opacity="0.28"/><circle cx="376" cy="191" r="3.1" fill="#fff" opacity="0.24"/><circle cx="812" cy="189" r="3.0" fill="#fff" opacity="0.77"/><circle cx="917" cy="198" r="2.9" fill="#fff" opacity="0.36"/><circle cx="609" cy="313" r="3.9" fill="#fff" opacity="0.34"/><circle cx="606" cy="185" r="2.8" fill="#fff" opacity="0.51"/><circle cx="91" cy="333" r="1.6" fill="#fff" opacity="0.37"/><circle cx="811" cy="213" r="2.9" fill="#fff" opacity="0.36"/>
      </g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="303" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#ec4899"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">DUVAR KAĞIDI &amp; LO-FI</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Lo-Fi Hip Hop Yağmurlu Pencere &amp;</tspan><tspan x="60" y="628.5">Kedili Gece</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#ec4899"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · BAŞLANGIÇ</text>
    <text x="841" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">LO-FI  ·  LOFI GIRL</text>
  </g>
</svg>
