<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Çift Monitör Panorama — Tribün Mozaği">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(120 .5 .5)">
      <stop offset="0" stop-color="#0d1a2a"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#0b1020" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <path d="M-300 1000 L-10 1000 L610 -200 L320 -200 Z" fill="#0b1020" opacity="0.11"/><path d="M-3 1000 L107 1000 L727 -200 L617 -200 Z" fill="#fbbf24" opacity="0.07"/><path d="M342 1000 L642 1000 L1262 -200 L962 -200 Z" fill="#0b1020" opacity="0.17"/><path d="M985 1000 L1104 1000 L1724 -200 L1605 -200 Z" fill="#fbbf24" opacity="0.07"/><path d="M1528 1000 L1681 1000 L2301 -200 L2148 -200 Z" fill="#0b1020" opacity="0.07"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="807" cy="567" rx="380" ry="150" fill="#fbbf24" opacity=".18" filter="url(#soften)"/>

  <g transform="translate(600 400) rotate(14.6) scale(-1.142 1.133) translate(-600 -400)"><g>
        <rect x="186" y="203" width="884" height="453" rx="26" fill="rgba(6,12,22,.72)" stroke="rgba(255,255,255,.42)" stroke-width="3"/>
        <rect x="212" y="229" width="832" height="401" rx="16" fill="rgba(4,9,18,.55)"/>
        <g fill="#fbbf24" opacity=".5"><path d="M186 592 C416 429 628 484 840 384 L1070 384 L1070 656 Z"</g>
        <circle cx="345" cy="330" r="104" fill="#0b1020" opacity=".3"/>
        <rect x="246" y="257" width="38" height="38" rx="10" fill="#fff" opacity="0.27"/><rect x="310" y="257" width="38" height="38" rx="10" fill="#fff" opacity="0.10"/><rect x="374" y="257" width="38" height="38" rx="10" fill="#fff" opacity="0.14"/><rect x="246" y="319" width="38" height="38" rx="10" fill="#fff" opacity="0.11"/><rect x="310" y="319" width="38" height="38" rx="10" fill="#fff" opacity="0.28"/><rect x="374" y="319" width="38" height="38" rx="10" fill="#fff" opacity="0.28"/><rect x="246" y="381" width="38" height="38" rx="10" fill="#fff" opacity="0.27"/><rect x="310" y="381" width="38" height="38" rx="10" fill="#fff" opacity="0.31"/><rect x="374" y="381" width="38" height="38" rx="10" fill="#fff" opacity="0.19"/><rect x="246" y="443" width="38" height="38" rx="10" fill="#fff" opacity="0.25"/><rect x="310" y="443" width="38" height="38" rx="10" fill="#fff" opacity="0.11"/><rect x="374" y="443" width="38" height="38" rx="10" fill="#fff" opacity="0.27"/>
        <rect x="672" y="293" width="318" height="173" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="694" y="347" width="318" height="192" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="716" y="401" width="318" height="161" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="738" y="455" width="318" height="158" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/>
        <rect x="520" y="678" width="160" height="20" rx="10" fill="rgba(255,255,255,.28)"/>
        <rect x="450" y="698" width="300" height="12" rx="6" fill="rgba(255,255,255,.16)"/>
      </g></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="488" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#fbbf24"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">BILGISAYAR &amp; TELEFON DUVAR KAĞIDI</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Çift Monitör Panorama — Tribün</tspan><tspan x="60" y="628.5">Mozaği</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#fbbf24"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · İLERI DÜZEY</text>
    <text x="733" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">DUVAR KAĞIDI  ·  ÇIFT MONITÖR</text>
  </g>
</svg>
