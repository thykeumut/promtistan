<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Görsel Çözünürlüğü &amp; Detayları 8K Keskinliğe Yükseltme">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(136 .5 .5)">
      <stop offset="0" stop-color="#2a131c"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#f43f5e" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#f97316" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <path d="M369 -160 L153 960 L585 960 Z" fill="#f97316" opacity="0.11"/><path d="M369 -160 L45 960 L693 960 Z" fill="#f43f5e" opacity="0.07"/><path d="M369 -160 L-63 960 L801 960 Z" fill="#f97316" opacity="0.13"/><path d="M369 -160 L-171 960 L909 960 Z" fill="#f43f5e" opacity="0.10"/><path d="M369 -160 L-279 960 L1017 960 Z" fill="#f97316" opacity="0.13"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="333" cy="623" rx="380" ry="150" fill="#f43f5e" opacity=".18" filter="url(#soften)"/>

  <g>
        <rect x="272" y="186" width="312" height="330" rx="22" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.4)" stroke-width="2"/>
        <rect x="616" y="186" width="312" height="330" rx="22" fill="rgba(10,16,24,.55)" stroke="rgba(255,255,255,.4)" stroke-width="2"/>
        <path d="M600 160 L600 542" stroke="#f43f5e" stroke-width="4" stroke-dasharray="18 14"/>
        <circle cx="600" cy="351" r="54" fill="#2a131c" stroke="rgba(255,255,255,.9)" stroke-width="3"/>
        <path d="M600 351 L640 311" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>
        <path d="M566 392 l-46 46 26 8 8 26 46 -46 z" fill="#f97316"/>
        <path d="M340 300 h180 M340 360 h140 M340 420 h180" stroke="rgba(255,255,255,.4)" stroke-width="10" stroke-linecap="round" opacity=".55"/>
        <path d="M690 300 h180 M690 360 h180 M690 420 h120" stroke="#f43f5e" stroke-width="10" stroke-linecap="round" opacity=".5"/>
      </g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="388" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#f43f5e"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">GÖRSEL DÜZENLEME &amp; INPAINT</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="50" font-weight="800" fill="#ffffff"><tspan x="60" y="568.0">Görsel Çözünürlüğü &amp; Detayları 8K</tspan><tspan x="60" y="624.0">Keskinliğe Yükseltme</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#f43f5e"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · ORTA</text>
    <text x="758" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">8K UPSCALE  ·  NETLEŞTIRME</text>
  </g>
</svg>
