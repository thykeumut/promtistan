          <path d="M-78 -44 H78 V-6 C78 26 44 52 0 62 C-44 52 -78 26 -78 -6 Z" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="3"/>
          <path d="M-52 -44 C-30 -76 30 -76 52 -44" fill="none" stroke="#7c2d12" stroke-width="8" stroke-linecap="round"/>
