  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Yedek Kulübesi ve Kutlama —</tspan><tspan x="60" y="628.5">Sinematik Belgesel</tspan></text>

