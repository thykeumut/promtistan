<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Duvar Kağıdı Seti — Karanlık Ama Renkli Seri">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(131 .5 .5)">
      <stop offset="0" stop-color="#0d1a2a"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#0c1a2b" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0c1a2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <ellipse cx="877" cy="139" rx="220" ry="141" fill="none" stroke="#0c1a2b" stroke-width="2.2" opacity="0.17"/><ellipse cx="877" cy="139" rx="380" ry="194" fill="none" stroke="#7dd3fc" stroke-width="4.5" opacity="0.26"/><ellipse cx="877" cy="139" rx="578" ry="308" fill="none" stroke="#0c1a2b" stroke-width="3.3" opacity="0.12"/><ellipse cx="877" cy="139" rx="689" ry="387" fill="none" stroke="#7dd3fc" stroke-width="2.5" opacity="0.15"/><ellipse cx="877" cy="139" rx="814" ry="500" fill="none" stroke="#0c1a2b" stroke-width="4.3" opacity="0.14"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="574" cy="663" rx="380" ry="150" fill="#7dd3fc" opacity=".18" filter="url(#soften)"/>

  <g transform="translate(600 400) rotate(6.7) scale(1.244 1.205) translate(-600 -400)"><g>
        <rect x="183" y="233" width="921" height="431" rx="26" fill="rgba(6,12,22,.72)" stroke="rgba(255,255,255,.42)" stroke-width="3"/>
        <rect x="209" y="259" width="869" height="379" rx="16" fill="rgba(4,9,18,.55)"/>
        <g fill="#7dd3fc" opacity=".5"><path d="M183 603 C422 448 643 500 864 405 L1104 405 L1104 663 Z"</g>
        <circle cx="348" cy="353" r="94" fill="#0c1a2b" opacity=".3"/>
        <rect x="243" y="287" width="38" height="38" rx="10" fill="#fff" opacity="0.12"/><rect x="307" y="287" width="38" height="38" rx="10" fill="#fff" opacity="0.22"/><rect x="371" y="287" width="38" height="38" rx="10" fill="#fff" opacity="0.23"/><rect x="243" y="349" width="38" height="38" rx="10" fill="#fff" opacity="0.31"/><rect x="307" y="349" width="38" height="38" rx="10" fill="#fff" opacity="0.29"/><rect x="371" y="349" width="38" height="38" rx="10" fill="#fff" opacity="0.13"/>
        <rect x="689" y="323" width="332" height="166" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="711" y="377" width="332" height="183" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="733" y="431" width="332" height="188" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/>
        <rect x="520" y="685" width="160" height="20" rx="10" fill="rgba(255,255,255,.28)"/>
        <rect x="450" y="705" width="300" height="12" rx="6" fill="rgba(255,255,255,.16)"/>
      </g></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="488" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#7dd3fc"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">BILGISAYAR &amp; TELEFON DUVAR KAĞIDI</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Duvar Kağıdı Seti — Karanlık Ama</tspan><tspan x="60" y="628.5">Renkli Seri</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#7dd3fc"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · İLERI DÜZEY</text>
    <text x="816" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">DUVAR KAĞIDI  ·  SERI</text>
  </g>
</svg>
