<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Geleneksel Suluboya &amp; Mürekkep Doğa Manzarası">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(129 .5 .5)">
      <stop offset="0" stop-color="#122430"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#14b8a6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <ellipse cx="777" cy="148" rx="220" ry="98" fill="none" stroke="#14b8a6" stroke-width="2.4" opacity="0.17"/><ellipse cx="777" cy="148" rx="394" ry="272" fill="none" stroke="#0ea5e9" stroke-width="2.5" opacity="0.19"/><ellipse cx="777" cy="148" rx="529" ry="293" fill="none" stroke="#14b8a6" stroke-width="4.9" opacity="0.18"/><ellipse cx="777" cy="148" rx="581" ry="307" fill="none" stroke="#0ea5e9" stroke-width="4.0" opacity="0.20"/><ellipse cx="777" cy="148" rx="705" ry="437" fill="none" stroke="#14b8a6" stroke-width="4.9" opacity="0.23"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="737" cy="618" rx="380" ry="150" fill="#0ea5e9" opacity=".18" filter="url(#soften)"/>

  <g>
        <path d="M600.0,388.0 L487.4,323.0 L487.4,193.0 L600.0,128.0 L712.6,193.0 L712.6,323.0 Z" fill="#0ea5e9" opacity=".85"/>
        <path d="M470 258 L600 320 L600 470 L470 408 Z" fill="#14b8a6" opacity=".75"/>
        <path d="M730 258 L600 320 L600 470 L730 408 Z" fill="#0b1220" opacity=".7"/>
        <g stroke="rgba(255,255,255,.4)" stroke-width="2" fill="none">
          <path d="M600.0,388.0 L487.4,323.0 L487.4,193.0 L600.0,128.0 L712.6,193.0 L712.6,323.0 Z"/><path d="M470 258 L600 320 L600 470 L470 408 Z"/><path d="M730 258 L600 320 L600 470 L730 408 Z"/>
        </g>
        <circle cx="600" cy="470" r="150" fill="#0ea5e9" opacity=".16"/>
      </g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="260" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#0ea5e9"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">3D &amp; İLLÜSTRASYON</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Geleneksel Suluboya &amp; Mürekkep</tspan><tspan x="60" y="628.5">Doğa Manzarası</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#0ea5e9"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · ORTA</text>
    <text x="782" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">SULUBOYA  ·  WATERCOLOR</text>
  </g>
</svg>
