<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Stadyum Tüneli Duvar Kağıdı — Tek Noktadan Kaçış">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(119 .5 .5)">
      <stop offset="0" stop-color="#0d1a2a"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#fb7185" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#111827" stop-opacity=".45"/>
      <stop offset="1" stop-color="#111827" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <path d="M-300 1000 L-143 1000 L477 -200 L320 -200 Z" fill="#111827" opacity="0.10"/><path d="M127 1000 L274 1000 L894 -200 L747 -200 Z" fill="#fb7185" opacity="0.08"/><path d="M488 1000 L692 1000 L1312 -200 L1108 -200 Z" fill="#111827" opacity="0.15"/><path d="M1060 1000 L1346 1000 L1966 -200 L1680 -200 Z" fill="#fb7185" opacity="0.13"/><path d="M1527 1000 L1632 1000 L2252 -200 L2147 -200 Z" fill="#111827" opacity="0.17"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="348" cy="642" rx="380" ry="150" fill="#fb7185" opacity=".18" filter="url(#soften)"/>

  <g transform="translate(600 400) rotate(2.3) scale(-1.031 1.190) translate(-600 -400)"><g>
        <rect x="171" y="219" width="923" height="429" rx="26" fill="rgba(6,12,22,.72)" stroke="rgba(255,255,255,.42)" stroke-width="3"/>
        <rect x="197" y="245" width="871" height="377" rx="16" fill="rgba(4,9,18,.55)"/>
        <g fill="#fb7185" opacity=".5"><path d="M171 588 C411 434 632 485 854 391 L1094 391 L1094 648 Z"</g>
        <circle cx="337" cy="339" r="98" fill="#111827" opacity=".3"/>
        <rect x="231" y="273" width="38" height="38" rx="10" fill="#fff" opacity="0.17"/><rect x="295" y="273" width="38" height="38" rx="10" fill="#fff" opacity="0.30"/><rect x="359" y="273" width="38" height="38" rx="10" fill="#fff" opacity="0.24"/><rect x="231" y="335" width="38" height="38" rx="10" fill="#fff" opacity="0.23"/><rect x="295" y="335" width="38" height="38" rx="10" fill="#fff" opacity="0.15"/><rect x="359" y="335" width="38" height="38" rx="10" fill="#fff" opacity="0.14"/><rect x="231" y="397" width="38" height="38" rx="10" fill="#fff" opacity="0.16"/><rect x="295" y="397" width="38" height="38" rx="10" fill="#fff" opacity="0.17"/><rect x="359" y="397" width="38" height="38" rx="10" fill="#fff" opacity="0.27"/>
        <rect x="678" y="309" width="332" height="162" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="700" y="363" width="332" height="191" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="722" y="417" width="332" height="170" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/>
        <rect x="520" y="670" width="160" height="20" rx="10" fill="rgba(255,255,255,.28)"/>
        <rect x="450" y="690" width="300" height="12" rx="6" fill="rgba(255,255,255,.16)"/>
      </g></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="488" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#fb7185"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">BILGISAYAR &amp; TELEFON DUVAR KAĞIDI</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Stadyum Tüneli Duvar Kağıdı — Tek</tspan><tspan x="60" y="628.5">Noktadan Kaçış</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#fb7185"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · ORTA</text>
    <text x="802" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">DUVAR KAĞIDI  ·  TÜNEL</text>
  </g>
</svg>
