<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="16-Bit Nostaljik Retro Piksel Sanatı (Pixel Art)">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(140 .5 .5)">
      <stop offset="0" stop-color="#1d1730"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <rect x="174" y="317" width="102" height="483" fill="#8b5cf6" opacity="0.15"/><rect x="324" y="311" width="102" height="489" fill="#ec4899" opacity="0.14"/><rect x="474" y="225" width="102" height="575" fill="#8b5cf6" opacity="0.13"/><rect x="624" y="396" width="102" height="404" fill="#ec4899" opacity="0.10"/><rect x="774" y="457" width="102" height="343" fill="#8b5cf6" opacity="0.08"/><rect x="1074" y="436" width="102" height="364" fill="#8b5cf6" opacity="0.12"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="484" cy="657" rx="380" ry="150" fill="#8b5cf6" opacity=".18" filter="url(#soften)"/>

  <g><path d="M499.3,409.0 L439.5,374.5 L439.5,305.5 L499.3,270.9 L559.1,305.5 L559.1,374.5 Z" fill="#ec4899" opacity="0.72" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M449.9,393.9 L341.7,331.4 L341.7,206.3 L449.9,143.8 L558.2,206.3 L558.2,331.4 Z" fill="#8b5cf6" opacity="0.34" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M630.5,532.7 L524.8,471.7 L524.8,349.6 L630.5,288.6 L736.2,349.6 L736.2,471.7 Z" fill="#ec4899" opacity="0.61" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M671.2,465.6 L607.6,428.9 L607.6,355.5 L671.2,318.8 L734.8,355.5 L734.8,428.9 Z" fill="#8b5cf6" opacity="0.68" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M683.8,520.9 L567.9,454.0 L567.9,320.1 L683.8,253.1 L799.8,320.1 L799.8,454.0 Z" fill="#ec4899" opacity="0.64" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M451.9,429.9 L355.7,374.4 L355.7,263.3 L451.9,207.8 L548.1,263.3 L548.1,374.4 Z" fill="#8b5cf6" opacity="0.38" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M749.2,341.3 L666.7,293.7 L666.7,198.5 L749.2,150.9 L831.6,198.5 L831.6,293.7 Z" fill="#ec4899" opacity="0.51" stroke="rgba(255,255,255,.4)" stroke-width="2"/></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="303" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#8b5cf6"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">OYUN &amp; KONSEPT SANAT</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">16-Bit Nostaljik Retro Piksel Sanatı</tspan><tspan x="60" y="628.5">(Pixel Art)</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#8b5cf6"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · BAŞLANGIÇ</text>
    <text x="830" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">PIXEL ART  ·  16-BIT</text>
  </g>
</svg>
