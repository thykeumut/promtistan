<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Akan Çikolatalı Sıcak Sufle &amp; Vanilyalı Dondurma">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(134 .5 .5)">
      <stop offset="0" stop-color="#2a1c12"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#f97316" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#ef4444" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <polygon points="433,148 324,300 162,206 271,54" fill="#ef4444" opacity="0.10"/><polygon points="840,514 755,644 617,571 703,441" fill="#f97316" opacity="0.05"/><polygon points="36,743 -108,619 2,464 146,588" fill="#ef4444" opacity="0.10"/><polygon points="983,123 881,65 929,-41 1030,17" fill="#f97316" opacity="0.10"/><polygon points="223,420 392,424 404,592 236,589" fill="#ef4444" opacity="0.07"/><polygon points="318,251 130,223 139,33 327,61" fill="#f97316" opacity="0.10"/><polygon points="526,514 662,529 660,665 525,651" fill="#ef4444" opacity="0.06"/><polygon points="248,331 256,247 340,246 332,330" fill="#f97316" opacity="0.10"/><polygon points="113,188 159,252 101,304 54,241" fill="#ef4444" opacity="0.08"/><polygon points="221,274 266,372 173,426 128,328" fill="#f97316" opacity="0.09"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="306" cy="570" rx="380" ry="150" fill="#f97316" opacity=".18" filter="url(#soften)"/>

  <g transform="translate(600,340)">
        <ellipse rx="230" ry="170" fill="rgba(10,14,20,.55)" stroke="rgba(255,255,255,.4)" stroke-width="3"/>
        <ellipse rx="150" ry="108" fill="#f97316" opacity=".35"/>
        <ellipse rx="86" ry="62" fill="#ef4444" opacity=".55"/>
        <circle cx="230" cy="-150" r="16" fill="#f97316"/>
        <circle cx="196" cy="150" r="10" fill="#ef4444"/>
        <path d="M-186 -186 L-120 -120" stroke="rgba(255,255,255,.4)" stroke-width="8" stroke-linecap="round"/>
      </g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="275" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#f97316"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">YEMEK, MODA &amp; ÜRÜN</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Akan Çikolatalı Sıcak Sufle &amp;</tspan><tspan x="60" y="628.5">Vanilyalı Dondurma</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#f97316"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · ORTA</text>
    <text x="836" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">SUFLE  ·  ÇIKOLATA</text>
  </g>
</svg>
