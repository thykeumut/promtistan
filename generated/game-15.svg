<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Retro Arcade Atari Salonu 1980&apos;ler Neon Gece">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(123 .5 .5)">
      <stop offset="0" stop-color="#1d1730"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <circle cx="1113" cy="302" r="493" fill="#ec4899" opacity="0.08" filter="url(#soften)"/><circle cx="1079" cy="226" r="361" fill="#8b5cf6" opacity="0.10" filter="url(#soften)"/><circle cx="730" cy="668" r="445" fill="#ec4899" opacity="0.16" filter="url(#soften)"/><circle cx="1149" cy="595" r="476" fill="#8b5cf6" opacity="0.08" filter="url(#soften)"/><circle cx="428" cy="220" r="329" fill="#ec4899" opacity="0.12" filter="url(#soften)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="816" cy="668" rx="380" ry="150" fill="#8b5cf6" opacity=".18" filter="url(#soften)"/>

  <g><path d="M707.1,354.8 L653.9,324.1 L653.9,262.6 L707.1,231.9 L760.3,262.6 L760.3,324.1 Z" fill="#ec4899" opacity="0.40" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M418.1,438.6 L354.8,402.1 L354.8,329.0 L418.1,292.5 L481.4,329.0 L481.4,402.1 Z" fill="#8b5cf6" opacity="0.53" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M793.9,539.1 L708.3,489.7 L708.3,390.9 L793.9,341.5 L879.4,390.9 L879.4,489.7 Z" fill="#ec4899" opacity="0.61" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M575.7,377.3 L492.8,329.4 L492.8,233.6 L575.7,185.7 L658.7,233.6 L658.7,329.4 Z" fill="#8b5cf6" opacity="0.71" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M795.8,478.6 L692.0,418.7 L692.0,298.8 L795.8,238.8 L899.6,298.8 L899.6,418.7 Z" fill="#ec4899" opacity="0.60" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M710.2,411.8 L652.0,378.2 L652.0,311.1 L710.2,277.5 L768.3,311.1 L768.3,378.2 Z" fill="#8b5cf6" opacity="0.57" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M577.9,572.3 L457.4,502.7 L457.4,363.6 L577.9,294.0 L698.4,363.6 L698.4,502.7 Z" fill="#ec4899" opacity="0.43" stroke="rgba(255,255,255,.4)" stroke-width="2"/></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="303" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#8b5cf6"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">OYUN &amp; KONSEPT SANAT</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Retro Arcade Atari Salonu 1980&apos;ler</tspan><tspan x="60" y="628.5">Neon Gece</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#8b5cf6"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · ORTA</text>
    <text x="795" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">ARCADE  ·  ATARI SALONU</text>
  </g>
</svg>
