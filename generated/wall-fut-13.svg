<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Nostaljik Gazete Duvar Kağıdı — Eski Maç Manşeti">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(138 .5 .5)">
      <stop offset="0" stop-color="#0d1a2a"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#111827" stop-opacity=".45"/>
      <stop offset="1" stop-color="#111827" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <circle cx="559" cy="482" r="269" fill="#111827" opacity="0.11" filter="url(#soften)"/><circle cx="486" cy="354" r="391" fill="#fbbf24" opacity="0.15" filter="url(#soften)"/><circle cx="623" cy="358" r="287" fill="#111827" opacity="0.13" filter="url(#soften)"/><circle cx="1092" cy="323" r="318" fill="#fbbf24" opacity="0.10" filter="url(#soften)"/><circle cx="302" cy="470" r="412" fill="#111827" opacity="0.16" filter="url(#soften)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="681" cy="667" rx="380" ry="150" fill="#fbbf24" opacity=".18" filter="url(#soften)"/>

  <g transform="translate(600 400) rotate(-10.1) scale(-1.132 1.007) translate(-600 -400)"><g>
        <rect x="148" y="212" width="910" height="453" rx="26" fill="rgba(6,12,22,.72)" stroke="rgba(255,255,255,.42)" stroke-width="3"/>
        <rect x="174" y="238" width="858" height="401" rx="16" fill="rgba(4,9,18,.55)"/>
        <g fill="#fbbf24" opacity=".5"><path d="M148 601 C384 438 602 492 821 393 L1057 393 L1057 665 Z"</g>
        <circle cx="311" cy="339" r="102" fill="#111827" opacity=".3"/>
        <rect x="208" y="266" width="38" height="38" rx="10" fill="#fff" opacity="0.14"/><rect x="272" y="266" width="38" height="38" rx="10" fill="#fff" opacity="0.11"/><rect x="208" y="328" width="38" height="38" rx="10" fill="#fff" opacity="0.12"/><rect x="272" y="328" width="38" height="38" rx="10" fill="#fff" opacity="0.18"/>
        <rect x="648" y="302" width="328" height="170" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="670" y="356" width="328" height="192" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="692" y="410" width="328" height="184" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="714" y="464" width="328" height="186" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/>
        <rect x="520" y="687" width="160" height="20" rx="10" fill="rgba(255,255,255,.28)"/>
        <rect x="450" y="707" width="300" height="12" rx="6" fill="rgba(255,255,255,.16)"/>
      </g></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="488" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#fbbf24"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">BILGISAYAR &amp; TELEFON DUVAR KAĞIDI</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Nostaljik Gazete Duvar Kağıdı — Eski</tspan><tspan x="60" y="628.5">Maç Manşeti</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#fbbf24"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · ORTA</text>
    <text x="780" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">DUVAR KAĞIDI  ·  NOSTALJI</text>
  </g>
</svg>
