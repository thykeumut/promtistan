<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Studio Ghibli Masalsı Pastoral Köyü">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(140 .5 .5)">
      <stop offset="0" stop-color="#1d1730"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <path d="M-300 1000 L1 1000 L621 -200 L320 -200 Z" fill="#ec4899" opacity="0.10"/><path d="M-10 1000 L206 1000 L826 -200 L610 -200 Z" fill="#8b5cf6" opacity="0.09"/><path d="M345 1000 L655 1000 L1275 -200 L965 -200 Z" fill="#ec4899" opacity="0.10"/><path d="M988 1000 L1105 1000 L1725 -200 L1608 -200 Z" fill="#8b5cf6" opacity="0.13"/><path d="M1065 1000 L1164 1000 L1784 -200 L1685 -200 Z" fill="#ec4899" opacity="0.11"/><path d="M1222 1000 L1334 1000 L1954 -200 L1842 -200 Z" fill="#8b5cf6" opacity="0.10"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="766" cy="583" rx="380" ry="150" fill="#8b5cf6" opacity=".18" filter="url(#soften)"/>

  <g><path d="M649.8,442.6 L575.7,399.9 L575.7,314.3 L649.8,271.5 L723.9,314.3 L723.9,399.9 Z" fill="#ec4899" opacity="0.35" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M430.5,443.6 L343.2,393.2 L343.2,292.5 L430.5,242.1 L517.7,292.5 L517.7,393.2 Z" fill="#8b5cf6" opacity="0.69" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M753.2,314.1 L689.0,277.0 L689.0,202.9 L753.2,165.8 L817.4,202.9 L817.4,277.0 Z" fill="#ec4899" opacity="0.57" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M558.0,381.1 L489.4,341.5 L489.4,262.3 L558.0,222.7 L626.7,262.3 L626.7,341.5 Z" fill="#8b5cf6" opacity="0.67" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M611.7,344.6 L549.9,308.9 L549.9,237.5 L611.7,201.8 L673.5,237.5 L673.5,308.9 Z" fill="#ec4899" opacity="0.49" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M529.5,366.7 L454.3,323.3 L454.3,236.4 L529.5,193.0 L604.7,236.4 L604.7,323.3 Z" fill="#8b5cf6" opacity="0.49" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M623.1,463.7 L526.1,407.7 L526.1,295.7 L623.1,239.8 L720.0,295.7 L720.0,407.7 Z" fill="#ec4899" opacity="0.28" stroke="rgba(255,255,255,.4)" stroke-width="2"/></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="303" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#8b5cf6"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">OYUN &amp; KONSEPT SANAT</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="596.0">Studio Ghibli Masalsı Pastoral Köyü</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#8b5cf6"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · ORTA</text>
    <text x="761" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">STUDIO GHIBLI  ·  MIYAZAKI</text>
  </g>
</svg>
