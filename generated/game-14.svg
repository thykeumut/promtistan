<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Kutup Buzulu Altında Keşfedilen Uzay Gemisi">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(134 .5 .5)">
      <stop offset="0" stop-color="#1d1730"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <ellipse cx="752" cy="262" rx="220" ry="99" fill="none" stroke="#ec4899" stroke-width="4.3" opacity="0.13"/><ellipse cx="752" cy="262" rx="376" ry="218" fill="none" stroke="#8b5cf6" stroke-width="2.3" opacity="0.23"/><ellipse cx="752" cy="262" rx="477" ry="327" fill="none" stroke="#ec4899" stroke-width="4.8" opacity="0.20"/><ellipse cx="752" cy="262" rx="627" ry="421" fill="none" stroke="#8b5cf6" stroke-width="2.2" opacity="0.10"/><ellipse cx="752" cy="262" rx="844" ry="401" fill="none" stroke="#ec4899" stroke-width="3.6" opacity="0.24"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="604" cy="624" rx="380" ry="150" fill="#8b5cf6" opacity=".18" filter="url(#soften)"/>

  <g><path d="M523.8,491.2 L425.8,434.7 L425.8,321.6 L523.8,265.1 L621.7,321.6 L621.7,434.7 Z" fill="#ec4899" opacity="0.70" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M595.8,508.5 L485.6,444.9 L485.6,317.7 L595.8,254.1 L705.9,317.7 L705.9,444.9 Z" fill="#8b5cf6" opacity="0.47" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M782.6,530.9 L675.9,469.4 L675.9,346.2 L782.6,284.6 L889.2,346.2 L889.2,469.4 Z" fill="#ec4899" opacity="0.39" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M608.5,438.3 L549.5,404.3 L549.5,336.1 L608.5,302.1 L667.5,336.1 L667.5,404.3 Z" fill="#8b5cf6" opacity="0.55" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M460.7,365.9 L384.4,321.8 L384.4,233.7 L460.7,189.7 L537.0,233.7 L537.0,321.8 Z" fill="#ec4899" opacity="0.46" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M414.8,508.0 L360.7,476.8 L360.7,414.3 L414.8,383.1 L468.9,414.3 L468.9,476.8 Z" fill="#8b5cf6" opacity="0.42" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M639.7,470.6 L521.9,402.5 L521.9,266.4 L639.7,198.4 L757.6,266.4 L757.6,402.5 Z" fill="#ec4899" opacity="0.56" stroke="rgba(255,255,255,.4)" stroke-width="2"/></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="303" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#8b5cf6"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">OYUN &amp; KONSEPT SANAT</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Kutup Buzulu Altında Keşfedilen</tspan><tspan x="60" y="628.5">Uzay Gemisi</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#8b5cf6"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · UZMAN / MASTER</text>
    <text x="809" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">BILIM KURGU  ·  BUZUL</text>
  </g>
</svg>
