<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Synthwave Retro Gece Otoyolu 4K Duvar Kağıdı">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(130 .5 .5)">
      <stop offset="0" stop-color="#22162c"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <path d="M-300 1000 L-184 1000 L436 -200 L320 -200 Z" fill="#6366f1" opacity="0.08"/><path d="M57 1000 L270 1000 L890 -200 L677 -200 Z" fill="#ec4899" opacity="0.14"/><path d="M556 1000 L780 1000 L1400 -200 L1176 -200 Z" fill="#6366f1" opacity="0.12"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="791" cy="620" rx="380" ry="150" fill="#ec4899" opacity=".18" filter="url(#soften)"/>

  <g>
        <circle cx="600" cy="300" r="128" fill="#ec4899" opacity=".55"/>
        <circle cx="600" cy="300" r="128" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="2" opacity=".5"/>
        <circle cx="522" cy="286" r="112" fill="#22162c"/>
        <ellipse cx="600" cy="520" rx="420" ry="60" fill="#6366f1" opacity=".22"/>
        <circle cx="354" cy="319" r="3.2" fill="#fff" opacity="0.32"/><circle cx="1031" cy="299" r="3.4" fill="#fff" opacity="0.69"/><circle cx="779" cy="275" r="3.6" fill="#fff" opacity="0.46"/><circle cx="456" cy="227" r="2.8" fill="#fff" opacity="0.57"/><circle cx="814" cy="415" r="3.9" fill="#fff" opacity="0.43"/><circle cx="627" cy="279" r="2.6" fill="#fff" opacity="0.70"/><circle cx="18" cy="176" r="2.3" fill="#fff" opacity="0.78"/><circle cx="262" cy="191" r="3.3" fill="#fff" opacity="0.22"/><circle cx="3" cy="333" r="3.5" fill="#fff" opacity="0.72"/><circle cx="203" cy="286" r="2.2" fill="#fff" opacity="0.55"/><circle cx="1050" cy="363" r="2.1" fill="#fff" opacity="0.48"/><circle cx="950" cy="324" r="1.5" fill="#fff" opacity="0.75"/><circle cx="807" cy="232" r="3.5" fill="#fff" opacity="0.35"/><circle cx="13" cy="196" r="3.7" fill="#fff" opacity="0.63"/><circle cx="137" cy="144" r="2.7" fill="#fff" opacity="0.49"/><circle cx="315" cy="225" r="1.7" fill="#fff" opacity="0.42"/><circle cx="756" cy="240" r="4.0" fill="#fff" opacity="0.34"/><circle cx="115" cy="398" r="3.3" fill="#fff" opacity="0.45"/><circle cx="372" cy="376" r="3.5" fill="#fff" opacity="0.70"/><circle cx="1196" cy="295" r="2.1" fill="#fff" opacity="0.34"/><circle cx="958" cy="153" r="4.1" fill="#fff" opacity="0.65"/><circle cx="630" cy="355" r="2.5" fill="#fff" opacity="0.29"/><circle cx="9" cy="408" r="3.7" fill="#fff" opacity="0.55"/><circle cx="918" cy="430" r="3.0" fill="#fff" opacity="0.40"/><circle cx="41" cy="232" r="3.0" fill="#fff" opacity="0.52"/><circle cx="1113" cy="368" r="2.5" fill="#fff" opacity="0.62"/>
      </g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="303" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#ec4899"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">DUVAR KAĞIDI &amp; LO-FI</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Synthwave Retro Gece Otoyolu 4K</tspan><tspan x="60" y="628.5">Duvar Kağıdı</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#ec4899"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · ORTA</text>
    <text x="759" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">SYNTHWAVE  ·  NEON OTOYOL</text>
  </g>
</svg>
