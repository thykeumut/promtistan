<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Duvar Kağıdı Paketi — Aynı Sahnenin 4 Oranı">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(128 .5 .5)">
      <stop offset="0" stop-color="#0d1a2a"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".55"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#0f172a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <rect x="-160" y="-120" width="46" height="1040" fill="#60a5fa" opacity="0.08" transform="skewX(-18.2)"/><rect x="-22" y="-120" width="46" height="1040" fill="#0f172a" opacity="0.08" transform="skewX(-18.2)"/><rect x="116" y="-120" width="46" height="1040" fill="#0f172a" opacity="0.12" transform="skewX(-18.2)"/><rect x="255" y="-120" width="46" height="1040" fill="#60a5fa" opacity="0.15" transform="skewX(-18.2)"/><rect x="393" y="-120" width="46" height="1040" fill="#0f172a" opacity="0.08" transform="skewX(-18.2)"/><rect x="531" y="-120" width="46" height="1040" fill="#0f172a" opacity="0.13" transform="skewX(-18.2)"/><rect x="669" y="-120" width="46" height="1040" fill="#60a5fa" opacity="0.11" transform="skewX(-18.2)"/><rect x="807" y="-120" width="46" height="1040" fill="#0f172a" opacity="0.08" transform="skewX(-18.2)"/><rect x="945" y="-120" width="46" height="1040" fill="#0f172a" opacity="0.13" transform="skewX(-18.2)"/><rect x="1084" y="-120" width="46" height="1040" fill="#60a5fa" opacity="0.06" transform="skewX(-18.2)"/><rect x="1222" y="-120" width="46" height="1040" fill="#0f172a" opacity="0.09" transform="skewX(-18.2)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="377" cy="570" rx="380" ry="150" fill="#60a5fa" opacity=".18" filter="url(#soften)"/>

  <g transform="translate(600 400) rotate(6.5) scale(-1.058 1.035) translate(-600 -400)"><g>
        <rect x="191" y="220" width="905" height="430" rx="26" fill="rgba(6,12,22,.72)" stroke="rgba(255,255,255,.42)" stroke-width="3"/>
        <rect x="217" y="246" width="853" height="378" rx="16" fill="rgba(4,9,18,.55)"/>
        <g fill="#60a5fa" opacity=".5"><path d="M191 589 C426 435 643 486 860 392 L1096 392 L1096 649 Z"</g>
        <circle cx="354" cy="340" r="105" fill="#0f172a" opacity=".3"/>
        <rect x="251" y="274" width="38" height="38" rx="10" fill="#fff" opacity="0.13"/><rect x="315" y="274" width="38" height="38" rx="10" fill="#fff" opacity="0.13"/><rect x="251" y="336" width="38" height="38" rx="10" fill="#fff" opacity="0.28"/><rect x="315" y="336" width="38" height="38" rx="10" fill="#fff" opacity="0.14"/><rect x="251" y="398" width="38" height="38" rx="10" fill="#fff" opacity="0.28"/><rect x="315" y="398" width="38" height="38" rx="10" fill="#fff" opacity="0.15"/>
        <rect x="688" y="310" width="326" height="160" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="710" y="364" width="326" height="197" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/>
        <rect x="520" y="671" width="160" height="20" rx="10" fill="rgba(255,255,255,.28)"/>
        <rect x="450" y="691" width="300" height="12" rx="6" fill="rgba(255,255,255,.16)"/>
      </g></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="488" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#60a5fa"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">BILGISAYAR &amp; TELEFON DUVAR KAĞIDI</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Duvar Kağıdı Paketi — Aynı Sahnenin</tspan><tspan x="60" y="628.5">4 Oranı</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#60a5fa"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · ORTA</text>
    <text x="753" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">DUVAR KAĞIDI  ·  ÇOK ORANLI</text>
  </g>
</svg>
