        <rect x="708" y="294" width="341" height="192" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="730" y="348" width="341" height="189" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="752" y="402" width="341" height="156" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/>
        <rect x="520" y="674" width="160" height="20" rx="10" fill="rgba(255,255,255,.28)"/>
        <rect x="450" y="694" width="300" height="12" rx="6" fill="rgba(255,255,255,.16)"/>
