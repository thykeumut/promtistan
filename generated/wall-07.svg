<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Sonsuz Çiçek Açmış Japon Kiraz Ağaçları (Sakura)">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(118 .5 .5)">
      <stop offset="0" stop-color="#22162c"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <path d="M750 -160 L534 960 L966 960 Z" fill="#6366f1" opacity="0.10"/><path d="M750 -160 L444 960 L1056 960 Z" fill="#ec4899" opacity="0.06"/><path d="M750 -160 L354 960 L1146 960 Z" fill="#6366f1" opacity="0.07"/><path d="M750 -160 L264 960 L1236 960 Z" fill="#ec4899" opacity="0.09"/><path d="M750 -160 L174 960 L1326 960 Z" fill="#6366f1" opacity="0.10"/><path d="M750 -160 L84 960 L1416 960 Z" fill="#ec4899" opacity="0.07"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="734" cy="656" rx="380" ry="150" fill="#ec4899" opacity=".18" filter="url(#soften)"/>

  <g>
        <circle cx="600" cy="300" r="128" fill="#ec4899" opacity=".55"/>
        <circle cx="600" cy="300" r="128" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="2" opacity=".5"/>
        <circle cx="522" cy="286" r="112" fill="#22162c"/>
        <ellipse cx="600" cy="520" rx="420" ry="60" fill="#6366f1" opacity=".22"/>
        <circle cx="556" cy="263" r="3.1" fill="#fff" opacity="0.66"/><circle cx="1192" cy="167" r="4.0" fill="#fff" opacity="0.39"/><circle cx="1015" cy="232" r="3.7" fill="#fff" opacity="0.20"/><circle cx="226" cy="369" r="3.9" fill="#fff" opacity="0.39"/><circle cx="507" cy="207" r="4.4" fill="#fff" opacity="0.29"/><circle cx="432" cy="371" r="3.1" fill="#fff" opacity="0.57"/><circle cx="817" cy="180" r="3.8" fill="#fff" opacity="0.77"/><circle cx="637" cy="337" r="1.7" fill="#fff" opacity="0.59"/><circle cx="418" cy="318" r="3.9" fill="#fff" opacity="0.32"/><circle cx="1186" cy="444" r="1.9" fill="#fff" opacity="0.74"/><circle cx="160" cy="440" r="3.7" fill="#fff" opacity="0.40"/><circle cx="803" cy="398" r="3.6" fill="#fff" opacity="0.45"/><circle cx="513" cy="245" r="3.3" fill="#fff" opacity="0.51"/><circle cx="1042" cy="209" r="3.7" fill="#fff" opacity="0.68"/><circle cx="833" cy="417" r="2.6" fill="#fff" opacity="0.45"/><circle cx="99" cy="351" r="2.4" fill="#fff" opacity="0.36"/><circle cx="160" cy="282" r="2.4" fill="#fff" opacity="0.24"/><circle cx="168" cy="294" r="4.2" fill="#fff" opacity="0.79"/><circle cx="79" cy="449" r="3.9" fill="#fff" opacity="0.26"/><circle cx="294" cy="170" r="4.4" fill="#fff" opacity="0.43"/><circle cx="225" cy="449" r="1.8" fill="#fff" opacity="0.50"/><circle cx="999" cy="337" r="3.6" fill="#fff" opacity="0.28"/><circle cx="940" cy="229" r="3.0" fill="#fff" opacity="0.80"/><circle cx="121" cy="290" r="2.1" fill="#fff" opacity="0.66"/><circle cx="259" cy="322" r="3.6" fill="#fff" opacity="0.78"/><circle cx="274" cy="417" r="3.9" fill="#fff" opacity="0.54"/>
      </g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="303" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#ec4899"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">DUVAR KAĞIDI &amp; LO-FI</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Sonsuz Çiçek Açmış Japon Kiraz</tspan><tspan x="60" y="628.5">Ağaçları (Sakura)</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#ec4899"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · BAŞLANGIÇ</text>
    <text x="787" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">SAKURA  ·  KIRAZ ÇIÇEĞI</text>
  </g>
</svg>
