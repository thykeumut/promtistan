<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Uçsuz Bucaksız Çöl &amp; Antik Titan Robot Harabeleri">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(118 .5 .5)">
      <stop offset="0" stop-color="#1d1730"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <rect x="-160" y="-120" width="54" height="1040" fill="#8b5cf6" opacity="0.11" transform="skewX(-20.2)"/><rect x="-8" y="-120" width="54" height="1040" fill="#ec4899" opacity="0.11" transform="skewX(-20.2)"/><rect x="144" y="-120" width="54" height="1040" fill="#ec4899" opacity="0.09" transform="skewX(-20.2)"/><rect x="296" y="-120" width="54" height="1040" fill="#8b5cf6" opacity="0.06" transform="skewX(-20.2)"/><rect x="448" y="-120" width="54" height="1040" fill="#ec4899" opacity="0.07" transform="skewX(-20.2)"/><rect x="600" y="-120" width="54" height="1040" fill="#ec4899" opacity="0.14" transform="skewX(-20.2)"/><rect x="752" y="-120" width="54" height="1040" fill="#8b5cf6" opacity="0.09" transform="skewX(-20.2)"/><rect x="904" y="-120" width="54" height="1040" fill="#ec4899" opacity="0.08" transform="skewX(-20.2)"/><rect x="1056" y="-120" width="54" height="1040" fill="#ec4899" opacity="0.13" transform="skewX(-20.2)"/><rect x="1208" y="-120" width="54" height="1040" fill="#8b5cf6" opacity="0.14" transform="skewX(-20.2)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="488" cy="574" rx="380" ry="150" fill="#8b5cf6" opacity=".18" filter="url(#soften)"/>

  <g><path d="M527.8,357.3 L431.3,301.6 L431.3,190.2 L527.8,134.6 L624.2,190.2 L624.2,301.6 Z" fill="#ec4899" opacity="0.43" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M429.6,504.4 L333.6,449.0 L333.6,338.2 L429.6,282.7 L525.6,338.2 L525.6,449.0 Z" fill="#8b5cf6" opacity="0.56" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M423.1,519.4 L310.5,454.4 L310.5,324.3 L423.1,259.3 L535.8,324.3 L535.8,454.4 Z" fill="#ec4899" opacity="0.41" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M472.7,529.2 L394.6,484.2 L394.6,394.0 L472.7,348.9 L550.8,394.0 L550.8,484.2 Z" fill="#8b5cf6" opacity="0.46" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M728.5,390.0 L614.9,324.5 L614.9,193.4 L728.5,127.8 L842.0,193.4 L842.0,324.5 Z" fill="#ec4899" opacity="0.29" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M662.1,379.7 L599.1,343.3 L599.1,270.6 L662.1,234.2 L725.1,270.6 L725.1,343.3 Z" fill="#8b5cf6" opacity="0.41" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M713.4,374.2 L610.2,314.6 L610.2,195.4 L713.4,135.8 L816.7,195.4 L816.7,314.6 Z" fill="#ec4899" opacity="0.46" stroke="rgba(255,255,255,.4)" stroke-width="2"/></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="303" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#8b5cf6"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">OYUN &amp; KONSEPT SANAT</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="50" font-weight="800" fill="#ffffff"><tspan x="60" y="568.0">Uçsuz Bucaksız Çöl &amp; Antik Titan Robot</tspan><tspan x="60" y="624.0">Harabeleri</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#8b5cf6"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · İLERI DÜZEY</text>
    <text x="771" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">BILIM KURGU  ·  DEV ROBOT</text>
  </g>
</svg>
