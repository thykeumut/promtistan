<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Sinematik Gece Şehri ve Taksi">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(118 .5 .5)">
      <stop offset="0" stop-color="#22162c"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <rect x="-160" y="-120" width="39" height="1040" fill="#ec4899" opacity="0.12" transform="skewX(-18.3)"/><rect x="-22" y="-120" width="39" height="1040" fill="#6366f1" opacity="0.07" transform="skewX(-18.3)"/><rect x="116" y="-120" width="39" height="1040" fill="#6366f1" opacity="0.11" transform="skewX(-18.3)"/><rect x="255" y="-120" width="39" height="1040" fill="#ec4899" opacity="0.06" transform="skewX(-18.3)"/><rect x="393" y="-120" width="39" height="1040" fill="#6366f1" opacity="0.11" transform="skewX(-18.3)"/><rect x="531" y="-120" width="39" height="1040" fill="#6366f1" opacity="0.14" transform="skewX(-18.3)"/><rect x="669" y="-120" width="39" height="1040" fill="#ec4899" opacity="0.11" transform="skewX(-18.3)"/><rect x="807" y="-120" width="39" height="1040" fill="#6366f1" opacity="0.08" transform="skewX(-18.3)"/><rect x="945" y="-120" width="39" height="1040" fill="#6366f1" opacity="0.08" transform="skewX(-18.3)"/><rect x="1084" y="-120" width="39" height="1040" fill="#ec4899" opacity="0.11" transform="skewX(-18.3)"/><rect x="1222" y="-120" width="39" height="1040" fill="#6366f1" opacity="0.08" transform="skewX(-18.3)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="425" cy="597" rx="380" ry="150" fill="#ec4899" opacity=".18" filter="url(#soften)"/>

  <g>
        <circle cx="600" cy="300" r="128" fill="#ec4899" opacity=".55"/>
        <circle cx="600" cy="300" r="128" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="2" opacity=".5"/>
        <circle cx="522" cy="286" r="112" fill="#22162c"/>
        <ellipse cx="600" cy="520" rx="420" ry="60" fill="#6366f1" opacity=".22"/>
        <circle cx="30" cy="238" r="2.3" fill="#fff" opacity="0.53"/><circle cx="1193" cy="456" r="2.5" fill="#fff" opacity="0.42"/><circle cx="121" cy="232" r="3.3" fill="#fff" opacity="0.49"/><circle cx="829" cy="283" r="3.6" fill="#fff" opacity="0.57"/><circle cx="1174" cy="344" r="3.5" fill="#fff" opacity="0.54"/><circle cx="813" cy="271" r="1.7" fill="#fff" opacity="0.29"/><circle cx="1162" cy="222" r="4.3" fill="#fff" opacity="0.67"/><circle cx="1154" cy="152" r="4.5" fill="#fff" opacity="0.48"/><circle cx="1124" cy="274" r="1.6" fill="#fff" opacity="0.29"/><circle cx="413" cy="323" r="4.2" fill="#fff" opacity="0.22"/><circle cx="526" cy="345" r="4.2" fill="#fff" opacity="0.52"/><circle cx="641" cy="388" r="1.5" fill="#fff" opacity="0.70"/><circle cx="277" cy="246" r="1.7" fill="#fff" opacity="0.64"/><circle cx="191" cy="274" r="1.5" fill="#fff" opacity="0.58"/><circle cx="660" cy="438" r="1.6" fill="#fff" opacity="0.21"/><circle cx="584" cy="397" r="3.0" fill="#fff" opacity="0.21"/><circle cx="538" cy="192" r="3.7" fill="#fff" opacity="0.36"/><circle cx="969" cy="201" r="4.0" fill="#fff" opacity="0.37"/><circle cx="289" cy="212" r="2.6" fill="#fff" opacity="0.78"/><circle cx="677" cy="443" r="2.4" fill="#fff" opacity="0.30"/><circle cx="980" cy="371" r="3.9" fill="#fff" opacity="0.37"/><circle cx="561" cy="274" r="1.9" fill="#fff" opacity="0.74"/><circle cx="1123" cy="354" r="2.2" fill="#fff" opacity="0.42"/><circle cx="258" cy="263" r="4.3" fill="#fff" opacity="0.26"/><circle cx="453" cy="170" r="3.9" fill="#fff" opacity="0.68"/><circle cx="1045" cy="282" r="1.6" fill="#fff" opacity="0.56"/>
      </g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="303" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#ec4899"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">DUVAR KAĞIDI &amp; LO-FI</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="68" font-weight="800" fill="#ffffff"><tspan x="60" y="557.9">Sinematik Gece Şehri ve</tspan><tspan x="60" y="634.1">Taksi</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#ec4899"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · İLERI DÜZEY</text>
    <text x="869" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">ŞEHIR  ·  GECE</text>
  </g>
</svg>
