<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Futbolcu Silueti Duvar Kağıdı — Sakin ve Koyu">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(138 .5 .5)">
      <stop offset="0" stop-color="#0d1a2a"/>
      <stop offset="1" stop-color="#0b0f10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#e879f9" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="12%" r="58%">
      <stop offset="0" stop-color="#1e1b4b" stop-opacity=".45"/>
      <stop offset="1" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#05070a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#base)"/>
  <polygon points="149,374 217,318 280,381 211,437" fill="#1e1b4b" opacity="0.15"/><polygon points="167,609 301,540 383,667 249,737" fill="#e879f9" opacity="0.14"/><polygon points="825,339 822,170 990,151 993,320" fill="#1e1b4b" opacity="0.17"/><polygon points="860,104 820,35 886,-11 925,58" fill="#e879f9" opacity="0.06"/><polygon points="-9,450 -13,361 76,349 80,438" fill="#1e1b4b" opacity="0.09"/><polygon points="826,227 686,305 596,173 735,95" fill="#e879f9" opacity="0.11"/><polygon points="841,313 656,343 609,162 793,132" fill="#1e1b4b" opacity="0.11"/><polygon points="1092,785 1005,883 900,806 987,708" fill="#e879f9" opacity="0.17"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>
  <ellipse cx="332" cy="611" rx="380" ry="150" fill="#e879f9" opacity=".18" filter="url(#soften)"/>

  <g transform="translate(600 400) rotate(5.7) scale(-1.258 1.024) translate(-600 -400)"><g>
        <rect x="184" y="219" width="895" height="405" rx="26" fill="rgba(6,12,22,.72)" stroke="rgba(255,255,255,.42)" stroke-width="3"/>
        <rect x="210" y="245" width="843" height="353" rx="16" fill="rgba(4,9,18,.55)"/>
        <g fill="#e879f9" opacity=".5"><path d="M184 567 C417 422 632 470 847 381 L1079 381 L1079 624 Z"</g>
        <circle cx="345" cy="332" r="89" fill="#1e1b4b" opacity=".3"/>
        <rect x="244" y="273" width="38" height="38" rx="10" fill="#fff" opacity="0.17"/><rect x="308" y="273" width="38" height="38" rx="10" fill="#fff" opacity="0.16"/><rect x="372" y="273" width="38" height="38" rx="10" fill="#fff" opacity="0.26"/><rect x="244" y="335" width="38" height="38" rx="10" fill="#fff" opacity="0.17"/><rect x="308" y="335" width="38" height="38" rx="10" fill="#fff" opacity="0.28"/><rect x="372" y="335" width="38" height="38" rx="10" fill="#fff" opacity="0.12"/><rect x="244" y="397" width="38" height="38" rx="10" fill="#fff" opacity="0.14"/><rect x="308" y="397" width="38" height="38" rx="10" fill="#fff" opacity="0.21"/><rect x="372" y="397" width="38" height="38" rx="10" fill="#fff" opacity="0.30"/>
        <rect x="676" y="309" width="322" height="201" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="698" y="363" width="322" height="154" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="720" y="417" width="322" height="153" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/><rect x="742" y="471" width="322" height="198" rx="14" fill="rgba(10,20,34,.6)" stroke="rgba(255,255,255,.3)" stroke-width="2"/>
        <rect x="520" y="646" width="160" height="20" rx="10" fill="rgba(255,255,255,.28)"/>
        <rect x="450" y="666" width="300" height="12" rx="6" fill="rgba(255,255,255,.16)"/>
      </g></g>

  <rect width="1200" height="800" fill="url(#scrim)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".07"/>

  <g transform="translate(60,58)">
    <rect width="488" height="46" rx="23" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.35)"/>
    <circle cx="26" cy="23" r="6" fill="#e879f9"/>
    <text x="44" y="30" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="1.2">BILGISAYAR &amp; TELEFON DUVAR KAĞIDI</text>
  </g>

  <text x="60" y="108" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="rgba(255,255,255,.62)" letter-spacing="3">PROMPTİSTAN · ÜRETİM REÇETESİ</text>

  <text font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff"><tspan x="60" y="563.5">Futbolcu Silueti Duvar Kağıdı —</tspan><tspan x="60" y="628.5">Sakin ve Koyu</tspan></text>

  <g transform="translate(60,738)">
    <rect width="6" height="26" rx="3" fill="#e879f9"/>
    <text x="22" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="rgba(255,255,255,.78)" letter-spacing="2">SEVİYE · BAŞLANGIÇ</text>
    <text x="798" y="20" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.5)">DUVAR KAĞIDI  ·  SILUET</text>
  </g>
</svg>
